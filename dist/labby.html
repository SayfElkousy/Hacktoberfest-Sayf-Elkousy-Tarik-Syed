/* =====================================================================
   Lab session engine + API (the "backend" seam for live sessions).

   Everything that changes authoritative progress goes through here:
   step completion, checkpoint release, responses, approvals,
   measurements, help requests and camera ownership. Every write takes
   an eventId; a repeated eventId is ignored, so retries and duplicate
   events from the live recording interface are safe.

   A "track" is one group's path through a procedure in a class session,
   or one research run's path through a protocol version.
   In production these functions are server endpoints (see INTEGRATION.md).
   ===================================================================== */
const CONTRACT_VERSION = '1.0';
const EventBus = {
  fns: new Set(),
  on(fn) { this.fns.add(fn); return () => this.fns.delete(fn); },
  emit(evt) { this.fns.forEach((fn) => { try { fn(evt); } catch (e) { console.error(e); } }); },
};
function emitEvent(type, data) {
  const e = { id: `ev_${uid(10)}`, type, at: Date.now(), ...data };
  S.events.push(e); if (S.events.length > 400) S.events.splice(0, 100);
  EventBus.emit(e);
  return e;
}
const seenEvent = (id) => !!id && S.processed.includes(id);
function markEvent(id) { if (!id) return; S.processed.push(id); if (S.processed.length > 1000) S.processed.splice(0, 300); }

/* ---------- Tracks ---------- */
function classTrack(sess, groupId) {
  const p = S.progress.find((x) => x.sessionId === sess.id && x.groupId === groupId);
  if (!p) return null;
  const g = groupById(groupId);
  return { kind: 'class', key: sess.id, sess, p, c: sessionContent(sess), groupId, versionId: sess.versionId, members: g ? g.memberIds : [], open: sess.status === 'active' };
}
function ensureProgressShape(p) {
  p.gates = p.gates || {}; p.joined = p.joined || []; p.aiFlags = p.aiFlags || []; p.guidance = p.guidance || [];
  p.observations = p.observations || []; p.activity = p.activity || []; p.completed = p.completed || [];
  if (p.atCheckpoint === undefined) p.atCheckpoint = null;
  if (p.camera === undefined) p.camera = null;
  return p;
}

/* ---------- Checkpoint records ---------- */
const cpRecordId = (trackKey, groupId, cpId, studentId) => `cpr_${trackKey}_${studentId || groupId}_${cpId}`;
function cpRecordFor(trackKey, groupId, cp, studentId) {
  const id = cpRecordId(trackKey, groupId, cp.id, cp.scope === 'individual' ? studentId : null);
  return S.cpRecords.find((r) => r.id === id) || null;
}
const cpRecordsOf = (trackKey, groupId, cpId) => S.cpRecords.filter((r) => r.trackKey === trackKey && r.groupId === groupId && r.checkpointId === cpId);
function ensureRecord(t, cp, studentId) {
  const sid = cp.scope === 'individual' ? studentId : null;
  const id = cpRecordId(t.key, t.groupId, cp.id, sid);
  let r = S.cpRecords.find((x) => x.id === id);
  if (!r) { r = { id, trackKey: t.key, groupId: t.groupId, studentId: sid, checkpointId: cp.id, status: 'draft', responses: {}, savedAt: Date.now(), submissions: 0, history: [] }; S.cpRecords.push(r); }
  return r;
}

const Engine = {
  gate(t, cp) {
    const p = t.p;
    if (!p.gates[cp.id]) p.gates[cp.id] = { releasedAt: Date.now(), approval: 'none' };
    return p.gates[cp.id];
  },
  gateState(t, cp) {
    const g = t.p.gates[cp.id] || { approval: 'none' };
    const recs = cpRecordsOf(t.key, t.groupId, cp.id).filter((r) => r.submittedAt && r.status === 'submitted');
    const needResponse = cp.kind === 'response' && (cp.responseRequired || cp.requireCorrect);
    let responded = true;
    if (needResponse) {
      if (cp.scope === 'group') responded = recs.some((r) => !r.studentId);
      else { const who = (t.p.joined || []).filter((id) => t.members.includes(id)); responded = who.length ? who.every((sid) => recs.some((r) => r.studentId === sid)) : recs.length > 0; }
    }
    const correctOk = !cp.requireCorrect || (recs.length > 0 && recs.every((r) => allCorrect(cp, r.responses)));
    const approvalOk = !cp.approvalRequired || g.approval === 'approved';
    const waitingOn = !responded ? 'response' : !correctOk ? 'correct' : !approvalOk ? (g.approval === 'returned' ? 'revision' : 'approval') : null;
    return { needResponse, responded, correctOk, approvalOk, approval: g.approval || 'none', satisfied: responded && correctOk && approvalOk, waitingOn, submittedCount: recs.length };
  },
  release(t, cp, at = Date.now()) {
    const fresh = !t.p.gates[cp.id];
    const g = this.gate(t, cp);
    if (fresh) { g.releasedAt = at; emitEvent('checkpoint.released', { trackKey: t.key, groupId: t.groupId, checkpointId: cp.id, stepId: cp.afterStepId }); logActivity(t.p, `Checkpoint released: ${cp.title}`, at); }
    return g;
  },
  /** Re-check the gate the track is waiting at; request approval or move on when allowed. */
  evaluate(t) {
    const p = t.p; if (!p.atCheckpoint) return 'none';
    const cp = checkpointById(t.c, p.atCheckpoint); if (!cp) { p.atCheckpoint = null; return 'missing'; }
    const st = this.gateState(t, cp); const g = this.gate(t, cp);
    if (st.responded && st.correctOk && cp.approvalRequired && g.approval !== 'approved' && g.approval !== 'pending' && g.approval !== 'returned') {
      g.approval = 'pending'; g.requestedAt = Date.now();
      emitEvent('approval.requested', { trackKey: t.key, groupId: t.groupId, checkpointId: cp.id });
      logActivity(p, `Waiting for teacher approval: ${cp.title}`);
    }
    if (st.satisfied) { this.advance(t); return 'advanced'; }
    return st.waitingOn;
  },
  advance(t, at = Date.now()) {
    const p = t.p; const c = t.c;
    const cp = checkpointById(c, p.atCheckpoint);
    p.atCheckpoint = null;
    const idx = cp ? stepIndexById(c, cp.afterStepId) : p.stepIndex;
    if (idx >= c.steps.length - 1) { this.finish(t, at); return; }
    p.stepIndex = idx + 1; p.stepStartedAt = at;
    logActivity(p, `Started step ${p.stepIndex + 1}: ${c.steps[p.stepIndex].title}`, at);
    emitEvent('progress.updated', { trackKey: t.key, groupId: t.groupId, stepId: c.steps[p.stepIndex].id });
  },
  finish(t, at = Date.now()) {
    const p = t.p; p.finishedAt = at; p.stepIndex = t.c.steps.length - 1; p.atCheckpoint = null;
    logActivity(p, 'Finished all steps', at);
    emitEvent('progress.updated', { trackKey: t.key, groupId: t.groupId, finished: true });
  },
  /** Confirmed completion of the current step. Returns ok | duplicate | stale | blocked | invalid. */
  completeStep(t, stepId, { by = null, source = 'student', at = Date.now() } = {}) {
    const p = ensureProgressShape(t.p); const c = t.c;
    const idx = stepIndexById(c, stepId);
    if (idx === -1) return { status: 'invalid', message: 'This step is not in the assigned procedure version.' };
    if (p.completed.some((x) => x.stepId === stepId)) return { status: 'duplicate' };
    if (p.finishedAt) return { status: 'duplicate' };
    if (p.atCheckpoint) return { status: 'blocked', message: 'Finish the checkpoint first.' };
    if (idx !== p.stepIndex) return { status: 'stale', message: `Step ${idx + 1} isn’t the current step.` };
    p.completed.push({ index: idx, stepId, at, by, source });
    logActivity(p, `Completed step ${idx + 1}: ${c.steps[idx].title}${source === 'teacher-demo' ? ' (demo control)' : ''}`, at);
    emitEvent('step.completed', { trackKey: t.key, groupId: t.groupId, stepId, by, source });
    const cp = checkpointAfter(c, stepId);
    if (cp) {
      this.release(t, cp, at);
      if (cpBlocks(cp)) { p.atCheckpoint = cp.id; p.stepStartedAt = at; this.evaluate(t); return { status: 'ok', checkpoint: cp.id, blocked: !!p.atCheckpoint }; }
    }
    if (idx >= c.steps.length - 1) this.finish(t, at);
    else { p.stepIndex = idx + 1; p.stepStartedAt = at; logActivity(p, `Started step ${idx + 2}: ${c.steps[idx + 1].title}`, at); }
    emitEvent('progress.updated', { trackKey: t.key, groupId: t.groupId, stepId: p.finishedAt ? null : c.steps[p.stepIndex].id });
    return { status: 'ok', checkpoint: cp ? cp.id : null, blocked: false };
  },
  saveResponse(t, cpId, studentId, responses, submit) {
    const cp = checkpointById(t.c, cpId);
    if (!cp) return { status: 'invalid', message: 'Checkpoint not found in this procedure version.' };
    if (!t.p.gates[cp.id]) return { status: 'invalid', message: 'This checkpoint hasn’t been released yet.' };
    const rec = ensureRecord(t, cp, studentId);
    const g = t.p.gates[cp.id];
    if (rec.status === 'submitted' && g.approval === 'approved') return { status: 'locked', message: 'Already approved by your teacher.', record: rec };
    const clean = {};
    for (const q of cp.questions) if (responses[q.id] !== undefined) clean[q.id] = String(responses[q.id]).slice(0, 4000);
    const same = JSON.stringify(clean) === JSON.stringify(rec.responses);
    if (submit && rec.status === 'submitted' && same) return { status: 'duplicate', record: rec };
    rec.responses = clean; rec.savedAt = Date.now();
    if (!submit) { if (rec.status !== 'submitted') rec.status = rec.status === 'returned' ? 'returned' : 'draft'; emitEvent('response.saved', { trackKey: t.key, groupId: t.groupId, checkpointId: cp.id, studentId }); return { status: 'ok', record: rec }; }
    const missing = missingAnswers(cp, clean);
    if (missing.length) return { status: 'incomplete', missing, record: rec };
    rec.status = 'submitted'; rec.submittedAt = Date.now(); rec.submittedBy = studentId; rec.submissions += 1;
    rec.history.push({ at: rec.submittedAt, text: rec.submissions > 1 ? 'Resubmitted' : 'Submitted' });
    if (g.approval === 'returned') { g.approval = 'none'; }
    logActivity(t.p, `${rec.submissions > 1 ? 'Resubmitted' : 'Submitted'} checkpoint response: ${cp.title}`);
    emitEvent('response.submitted', { trackKey: t.key, groupId: t.groupId, checkpointId: cp.id, studentId });
    if (t.p.atCheckpoint === cp.id) this.evaluate(t);
    return { status: 'ok', record: rec, correct: cp.requireCorrect ? allCorrect(cp, clean) : null };
  },
  approve(t, cpId, by) {
    const cp = checkpointById(t.c, cpId); const g = t.p.gates[cpId];
    if (!cp || !g) return { status: 'invalid' };
    if (g.approval === 'approved') return { status: 'duplicate' };
    g.approval = 'approved'; g.approvedAt = Date.now(); g.note = '';
    logActivity(t.p, `Teacher approved checkpoint: ${cp.title}`);
    emitEvent('checkpoint.approved', { trackKey: t.key, groupId: t.groupId, checkpointId: cpId, by });
    if (t.p.atCheckpoint === cpId) this.evaluate(t);
    return { status: 'ok' };
  },
  returnForRevision(t, cpId, note, by) {
    const cp = checkpointById(t.c, cpId); const g = t.p.gates[cpId];
    if (!cp || !g) return { status: 'invalid' };
    g.approval = 'returned'; g.returnedAt = Date.now(); g.note = String(note || '').slice(0, 1000);
    cpRecordsOf(t.key, t.groupId, cpId).forEach((r) => { if (r.status === 'submitted') { r.status = 'returned'; r.history.push({ at: g.returnedAt, text: `Returned for revision${g.note ? ': ' + g.note : ''}` }); } });
    logActivity(t.p, `Teacher returned checkpoint for revision: ${cp.title}`);
    emitEvent('checkpoint.returned', { trackKey: t.key, groupId: t.groupId, checkpointId: cpId, note: g.note, by });
    return { status: 'ok' };
  },
  /** Demo helper: fill a checkpoint with clearly labeled sample answers so simulated groups can move on. */
  simulateResponses(t, cp) {
    const who = cp.scope === 'individual' ? (t.members.length ? [t.members[0]] : [null]) : [null];
    for (const sid of who) {
      const resp = {};
      cp.questions.forEach((q) => { resp[q.id] = q.type === 'mc' ? (q.correct || (q.options[0] || {}).id || '') : q.type === 'numeric' ? '3.4' : '(Simulated response from demo controls)'; });
      const r = ensureRecord(t, cp, sid); r.simulated = true;
      this.saveResponse(t, cp.id, sid, resp, true);
    }
  },
};

/* ---------- Public API for class sessions ---------- */
const LabSessionAPI = {
  /** Can this student use this session right now? Mirrors the server-side checks. */
  authorize(userId, sessionId) {
    const user = S.users.find((u) => u.id === userId);
    if (!user) return { ok: false, code: 'not_signed_in', message: 'Sign in to enter the lab.' };
    const sess = sessionById(sessionId);
    if (!sess) return { ok: false, code: 'not_found', message: 'This lab session doesn’t exist.' };
    const a = S.assignments.find((x) => x.id === sess.assignmentId);
    const enr = S.enrollments.find((e) => e.studentId === userId && e.classId === sess.classId && e.periodId === sess.periodId);
    if (!enr) return { ok: false, code: 'not_enrolled', message: 'You aren’t enrolled in the class period this session belongs to.' };
    if (!a || a.published === false) return { ok: false, code: 'not_published', message: 'Your teacher hasn’t published this lab yet.' };
    const group = studentGroup(sess.classId, sess.periodId, userId);
    if (!group) return { ok: false, code: 'no_group', message: 'Your teacher hasn’t put you in a lab group yet. Ask them to add you to a group.' };
    if (sess.status === 'completed') return { ok: true, code: 'completed', readOnly: true, sess, a, group, message: 'This session is complete.' };
    if (sess.status === 'paused') return { ok: true, code: 'paused', readOnly: true, sess, a, group, message: 'Your teacher paused the session.' };
    if (!sessionOpen(sess, a)) return { ok: false, code: 'not_open', sess, a, group, message: a.autoOpen ? `This session opens at ${fmtSchedule(a)}.` : 'Your teacher hasn’t opened this session yet.' };
    return { ok: true, code: 'open', sess, a, group };
  },
  /** Called when a student enters. Auto-opens a session the teacher scheduled to open on its own. */
  enter({ eventId, sessionId, participantId }) {
    const auth = this.authorize(participantId, sessionId);
    if (!auth.ok) return auth;
    if (auth.sess.status === 'scheduled' && auth.a.autoOpen) startSession(auth.sess);
    const t = classTrack(auth.sess, auth.group.id); if (!t) return { ok: false, code: 'not_found', message: 'No progress record for your group.' };
    ensureProgressShape(t.p);
    if (seenEvent(eventId)) return { ...auth, track: t, duplicate: true };
    markEvent(eventId);
    if (!t.p.joined.includes(participantId)) t.p.joined.push(participantId);
    if (t.p.connection === 'lost') t.p.connection = 'online';
    if (!t.p.stepStartedAt && !t.p.completed.length && !auth.readOnly) { t.p.stepStartedAt = Date.now(); }
    logActivity(t.p, `${displayName(S.users.find((u) => u.id === participantId))} entered the live session`);
    emitEvent('session.entered', { trackKey: t.key, groupId: t.groupId, participantId });
    return { ...auth, track: t };
  },
  track(sessionId, groupId) { const s = sessionById(sessionId); return s ? classTrack(s, groupId) : null; },
  write(eventId, t, fn) {
    if (seenEvent(eventId)) return { status: 'duplicate' };
    if (!t) return { status: 'invalid', message: 'Session or group not found.' };
    const res = fn();
    if (res && res.status !== 'invalid' && res.status !== 'stale' && res.status !== 'blocked' && res.status !== 'incomplete') markEvent(eventId);
    t.p.lastActivityAt = Date.now();
    return res;
  },
  completeStep({ eventId, sessionId, groupId, stepId, participantId, source = 'student' }) {
    const t = this.track(sessionId, groupId);
    if (t && t.sess.status !== 'active') return { status: 'blocked', message: t.sess.status === 'paused' ? 'The session is paused.' : 'The session isn’t running.' };
    return this.write(eventId, t, () => Engine.completeStep(t, stepId, { by: participantId, source }));
  },
  saveResponse({ eventId, sessionId, groupId, checkpointId, participantId, responses, submit }) {
    const t = this.track(sessionId, groupId);
    if (t && t.sess.status === 'completed') return { status: 'blocked', message: 'The session is complete.' };
    return this.write(eventId, t, () => Engine.saveResponse(t, checkpointId, participantId, responses, submit));
  },
  recordMeasurement({ eventId, sessionId, groupId, stepId, participantId, label, unit, value }) {
    const t = this.track(sessionId, groupId);
    return this.write(eventId, t, () => {
      const idx = stepIndexById(t.c, stepId); if (idx === -1) return { status: 'invalid' };
      const v = String(value).trim().slice(0, 200);
      const ex = t.p.observations.find((o) => o.stepId === stepId && o.label === label);
      if (ex) { if (ex.value === v) return { status: 'duplicate' }; ex.history = ex.history || []; ex.history.push({ at: ex.at, value: ex.value, by: ex.by }); ex.value = v; ex.at = Date.now(); ex.by = participantId; }
      else t.p.observations.push({ id: uid(), stepIndex: idx, stepId, label, unit, value: v, at: Date.now(), by: participantId });
      logActivity(t.p, `Recorded ${label}: ${v}${unit ? ' ' + unit : ''}`);
      emitEvent('measurement.recorded', { trackKey: t.key, groupId, stepId, label });
      return { status: 'ok' };
    });
  },
  requestHelp({ eventId, sessionId, groupId, participantId, category, message, aiDrafted = false }) {
    const t = this.track(sessionId, groupId);
    return this.write(eventId, t, () => {
      const res = Sim.help(t.p, t.sess, category, message);
      res.request.by = participantId; if (aiDrafted) res.request.aiDrafted = true;
      emitEvent('help.requested', { trackKey: t.key, groupId, requestId: res.request.id, updated: res.updated });
      return { status: 'ok', ...res };
    });
  },
  /** Only actionable AI flags reach the teacher, labeled as model-generated. */
  flag({ sessionId, groupId, kind, text, stepId }) {
    const t = this.track(sessionId, groupId); if (!t) return;
    const last = t.p.aiFlags[t.p.aiFlags.length - 1];
    if (last && last.kind === kind && last.stepId === stepId && Date.now() - last.at < 120000) return; // don't spam the teacher
    t.p.aiFlags.push({ id: uid(), at: Date.now(), kind, text: String(text).slice(0, 300), stepId });
    if (t.p.aiFlags.length > 12) t.p.aiFlags.shift();
  },
  /** One camera device per group. Returns camera_in_use when a teammate's device is already the camera. */
  setCamera({ sessionId, groupId, participantId, on, deviceLabel = '', force = false }) {
    const t = this.track(sessionId, groupId); if (!t) return { status: 'invalid' };
    const cam = t.p.camera; const now = Date.now();
    if (on) {
      if (cam && cam.holderId !== participantId && now - cam.beat < 90000 && !force) return { status: 'camera_in_use', holder: cam };
      t.p.camera = { holderId: participantId, holderName: displayName(S.users.find((u) => u.id === participantId)) || (studentById(participantId) || {}).name || 'A teammate', deviceLabel, since: now, beat: now };
      logActivity(t.p, `${t.p.camera.holderName}’s device started the group camera`);
    } else if (cam && cam.holderId === participantId) { t.p.camera = null; logActivity(t.p, 'Group camera stopped'); }
    return { status: 'ok' };
  },
  heartbeat({ sessionId, groupId, participantId }) { const t = this.track(sessionId, groupId); if (t && t.p.camera && t.p.camera.holderId === participantId) t.p.camera.beat = Date.now(); },
};

function submitSignin() {
  const f = U.auth.signin;
  const email = f.email.trim().toLowerCase();
  const user = S.users.find((u) => u.email.toLowerCase() === email);
  if (!email || !f.password) { f.error = 'Enter your email and password.'; commit(); return; }
  if (!user) { f.error = 'No Labby account uses this email in this browser. Create an account, or use one of the demo accounts below.'; commit(); return; }
  f.error = ''; f.password = '';
  S.currentUserId = user.id; commit(); go(homeFor(user.role));
}
function submitSignup() {
  const f = U.auth.signup; const e = {};
  if (!f.role) e.role = 'Choose Student, Teacher or Independent.';
  if (!f.name.trim()) e.name = 'Enter your name.';
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email.trim())) e.email = 'Enter an email address like name@school.edu.';
  else if (S.users.some((u) => u.email.toLowerCase() === f.email.trim().toLowerCase())) e.email = 'An account with this email already exists. Sign in instead.';
  if (f.password.length < 8) e.password = 'Use at least 8 characters.';
  f.errors = e;
  if (Object.keys(e).length) { commit(); const first = { role: 'input[name=role]', name: '#su-name', email: '#su-email', password: '#su-pass' }[Object.keys(e)[0]]; U.focusAfter = first; return; }
  const user = { id: uid(), name: f.name.trim(), email: f.email.trim(), role: f.role, school: f.school.trim(), createdAt: Date.now() };
  S.users.push(user); S.currentUserId = user.id;
  U.auth.signup = { name: '', email: '', password: '', role: '', school: '', errors: {} };
  commit(); go(homeFor(user.role));
  toast(`Account created. Welcome to Labby, ${user.name.split(' ')[0]}.`);
}

function stepEditor(path, p, s, i, n, errors) {

  return html`<article class="step-edit" data-key="${p}-s-${s.id}" aria-labelledby="${id}-lbl">
    <div class="step-edit-head">
      <span class="step-n" id="${id}-lbl" aria-label="Step ${i + 1}">${i + 1}</span>
      <input class="input sm grow" style="flex:1 1 200px" id="${id}-title" data-bind="${sp}.title" data-type="str" value="${s.title}" placeholder="Step title" aria-label="Step ${i + 1} title"${attr(!s.title.trim(), 'aria-invalid', 'true')}>
      <label class="row small" for="${id}-min" style="gap:6px"><span class="muted">Minutes</span>
        <input class="input sm num-in" type="number" min="1" id="${id}-min" data-bind="${sp}.minutes" data-type="numOrNull" value="${s.minutes ?? ''}" placeholder="?"${attr(noMin, 'aria-invalid', 'true')}></label>
      <div class="row" style="gap:2px">
        <button class="btn btn-ghost btn-icon btn-sm" data-action="step-move" data-path="${path}.steps" data-index="${i}" data-dir="-1" aria-label="Move step ${i + 1} up"${attr(i === 0, 'disabled')}>${icon('arrowUp', 'sm')}</button>
        <button class="btn btn-ghost btn-icon btn-sm" data-action="step-move" data-path="${path}.steps" data-index="${i}" data-dir="1" aria-label="Move step ${i + 1} down"${attr(i === n - 1, 'disabled')}>${icon('arrowDown', 'sm')}</button>
        <button class="btn btn-ghost btn-icon btn-sm" data-action="list-remove" data-path="${path}.steps" data-index="${i}" aria-label="Delete step ${i + 1}">${icon('trash', 'sm')}</button>
      </div>
    </div>
    <div class="step-edit-body">
      ${textareaField({ label: 'Instructions', id: `${id}-instr`, bind: `${sp}.instructions`, value: s.instructions, cls: 'span-2', rows: 2, error: !s.instructions.trim() ? 'Add instructions for students.' : '' })}
      <div class="field span-2"><label for="${id}-mats">Materials used in this step <span class="opt">(comma-separated)</span></label>
        <input class="input sm" id="${id}-mats" data-bind="${sp}.materials" data-type="csv" value="${s.materials.join(', ')}"></div>
      <div class="field span-2"><span class="label" id="${id}-in-lbl">Measurements or observations students record</span>
        <div class="stack tight" role="group" aria-labelledby="${id}-in-lbl">
          ${s.inputs.map((inp, j) => html`<div class="input-row" data-key="${id}-in-${j}">
            <input class="input sm" id="${id}-in-${j}" data-bind="${sp}.inputs.${j}.label" data-type="str" value="${inp.label}" placeholder="What to record" aria-label="Input ${j + 1} label">
            <input class="input sm" data-bind="${sp}.inputs.${j}.unit" data-type="str" value="${inp.unit}" placeholder="unit" aria-label="Input ${j + 1} unit">
            <button class="btn btn-ghost btn-icon btn-sm" data-action="list-remove" data-path="${sp}.inputs" data-index="${j}" aria-label="Remove input ${j + 1}">${icon('x', 'sm')}</button></div>`)}
          <button class="btn btn-xs btn-ghost" style="align-self:flex-start" data-action="input-add" data-path="${sp}.inputs">${icon('plus', 'sm')}Add measurement</button>
        </div></div>
      <div class="span-2"><label class="check"><input type="checkbox" data-change="cp-toggle" data-path="${path}" data-sid="${s.id}"${attr(!!checkpointAfter(getPath(S, path) || { checkpoints: [] }, s.id), 'checked')}><span>Teacher check after this step<span class="hint" style="display:block">Students wait for your approval before the next step.</span></span></label></div>
    </div>
  </article>`;
}

function flagsPanel(flags, path) {
  if (!flags.length) return html`<div class="notice ok">${icon('checkCircle')}<div>Nothing missing or unclear was found. Review the procedure before assigning it.</div></div>`;
  const missing = flags.filter((f) => f.level === 'missing').length;
  const unclear = flags.filter((f) => f.level === 'unclear').length;
  return html`<div class="stack tight">
    <div class="row wrap"><strong>Needs your review</strong>${missing ? html`<span class="pill tone-bad">${icon('alert')}${missing} missing</span>` : ''}${unclear ? html`<span class="pill tone-warn">${icon('question')}${unclear} unclear</span>` : ''}</div>
    <p class="hint">Labby doesn’t fill these in for you. Click an item to jump to it.</p>
    <div class="flag-list">${flags.map((f) => html`<div class="flag ${f.level === 'missing' ? 'missing' : ''}" ${f.level === 'info' ? raw('style="background:var(--blue-soft)"') : ''}>
      ${icon(f.level === 'missing' ? 'alert' : f.level === 'info' ? 'info' : 'question')}<span>${f.text}</span>
      ${f.field ? html`<button class="link-btn small" data-action="flag-go" data-path="${path}" data-field="${f.field}">Go to</button>` : html`<span></span>`}</div>`)}</div>
  </div>`;
}
function flagTargetId(path, fieldName, c) {
  const p = pidOf(path); const [kind, idx] = fieldName.split('.');
  if (kind === 'title') return `${p}-title`;
  if (kind === 'objectives') return c.objectives.length ? `${p}-obj-0` : `${p}-obj-add`;
  if (kind === 'materials') { if (idx == null) return `${p}-mat-add`; const m = c.materials[idx]; return !m ? `${p}-mat-add` : !m.name.trim() ? `${p}-mat-${idx}-name` : m.qtyPerGroup == null ? `${p}-mat-${idx}-qty` : `${p}-mat-${idx}-kind`; }
  if (kind === 'steps') { if (idx == null) return `${p}-step-add`; const s = c.steps[idx]; return !s ? `${p}-step-add` : !s.minutes ? `${p}-step-${idx}-min` : `${p}-step-${idx}-instr`; }
  if (kind === 'precautions') return c.precautions.length ? `${p}-pre-0` : `${p}-pre-add`;
  if (kind === 'cleanup') return c.cleanup.length ? `${p}-clean-0` : `${p}-clean-add`;
  return null;
}

/* =====================================================================

function sessionSummary(sess) {
  const c = sessionContent(sess); const ps = progressFor(sess.id); const now = Date.now();
  const st = ps.map((p) => groupStatus(p, sess, c, now).key);
  const unresolved = S.help.filter((h) => h.sessionId === sess.id && h.status !== 'resolved').length;
  return { c, ps, finished: st.filter((k) => k === 'completed').length, working: st.filter((k) => k !== 'completed').length, behind: st.filter((k) => k === 'behind').length, waiting: st.filter((k) => k === 'waiting').length, lost: st.filter((k) => k === 'lost').length, unresolved };
}

function activeLabCard(sess) {
  const sm = sessionSummary(sess); const c = sm.c; const now = Date.now();
  const remaining = plannedMinutes(c) * MIN - sessionElapsed(sess, now);
  const rows = [...sm.ps].sort((a, b) => groupById(a.groupId).name.localeCompare(groupById(b.groupId).name, undefined, { numeric: true }));
  return html`<section class="card" aria-labelledby="ov-active">
    <div class="card-head"><div class="stack tight"><span class="eyebrow">Active lab</span><h2 id="ov-active">${c.title}</h2>
      <span class="small muted">${classById(sess.classId).name} · ${periodName(sess.classId, sess.periodId)}</span></div>${sessionPill(sess.status)}</div>
    <div class="card-body stack loose">
      <div class="clock-block">
        <div><div class="k">Elapsed</div><div class="v">${tickSession(sess, 'elapsed')}</div></div>
        <div><div class="k">${remaining >= 0 ? 'Planned time left' : 'Past planned time'}</div><div class="v">${tickSession(sess, 'remaining')}</div></div>
        <div><div class="k">Planned length</div><div class="v">${plannedMinutes(c)} min</div></div>
      </div>
      <div class="stat-line" role="list">
        <div class="stat" role="listitem"><b>${sm.working}</b><span>groups working</span></div>
        <div class="stat" role="listitem"><b>${sm.finished}</b><span>finished</span></div>
        <div class="stat" role="listitem"><b>${sm.behind}</b><span>may be behind</span></div>
        <div class="stat" role="listitem"><b>${sm.unresolved}</b><span>unresolved help ${sm.unresolved === 1 ? 'request' : 'requests'}</span></div>
      </div>
      <div><h3 class="eyebrow" style="margin-bottom:4px">Group progress</h3>
        ${rows.map((p) => {
          const g = groupById(p.groupId); const gs = groupStatus(p, sess, c, now); const done = new Set(p.completed.map((x) => x.index));
          return html`<div class="mini-group" data-key="mg-${p.id}"><strong>${g.name}</strong>
            <div class="stack tight" style="min-width:0"><span class="small" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.finishedAt ? 'All steps done' : html`Step ${p.stepIndex + 1}/${c.steps.length} · ${c.steps[p.stepIndex].title}`}</span>
              ${segs(c.steps.length, done, p.stepIndex, !!p.finishedAt, `${done.size} of ${c.steps.length} steps complete`)}</div>
            <span class="pill-col">${groupPill(gs.key)}</span></div>`;
        })}
      </div>
    </div>
    <div class="card-foot"><button class="btn btn-primary" data-action="open-session" data-sid="${sess.id}" data-where="live">${icon('activity')}Open Live Progress</button>
      <span class="small muted">Statuses update as students work. In this demo, live events come from the demo controls.</span></div>
  </section>`;
}

function arrangeGroups(classId, periodId, size) {
  const students = enrolledStudents(classId, periodId);
  S.groups = S.groups.filter((g) => !(g.classId === classId && g.periodId === periodId));
  const n = Math.max(1, Math.ceil(students.length / size));
  const groups = Array.from({ length: n }, (_, i) => ({ id: uid(), classId, periodId, name: `Bench ${i + 1}`, memberIds: [] }));
  students.forEach((s, i) => groups[i % n].memberIds.push(s.id));
  S.groups.push(...groups);
  return groups.length;
}

function submitAssign() {
  const m = U.modal; const lab = labById(m.labId); const cls = classById(m.classId);
  if (!lab) { m.error = 'Choose a lab.'; commit(); return; }
  const v = latestReady(lab);

  if (!cls) { m.error = 'Choose a class.'; commit(); return; }
  if (!m.periodIds.length) { m.error = 'Choose at least one period.'; commit(); return; }
  if (!m.date) { m.error = 'Choose a date.'; commit(); return; }
  createAssignment(lab.id, v.id, cls.id, m.periodIds, m.date);
  const names = m.periodIds.map((p) => periodName(cls.id, p)).join(', ');
  U.modal = null; commit();
  toast(`${v.content.title} assigned to ${cls.name} · ${names}.`, 'send');
}

/* ---------- Designer actions ---------- */
function designerValidate() {
  const d = S.designer; const e = [];
  if (!d.form.experiment.trim() && !d.form.topic.trim()) e.push('experiment');
  if (!designerPeriods(d).length) e.push('periods');
  const gs = parseInt(d.logistics.groupSize, 10); if (!(gs >= 1 && gs <= 8)) e.push('groupSize');
  if (!(Number(d.logistics.labMinutes) > (Number(d.logistics.setupMinutes) || 0) + (Number(d.logistics.cleanupMinutes) || 0))) e.push('time');
  if (d.inventory.some((it) => it.name.trim() && !(Number(it.qty) >= 0 && it.qty !== '' && it.qty != null))) e.push('inventory');
  d.errors = e;
  return !e.length;
}
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
function pushMsg(m) { const msg = { id: uid(), at: Date.now(), changes: [], check: [], ...m }; S.designer.chat.push(msg); if (S.designer.chat.length > 40) S.designer.chat.shift(); return msg; }

async function designerGenerate() {
  const d = S.designer;
  if (AI.busy) return;
  if (!designerValidate()) { d.tab = 'inputs'; U.focusAfter = '#dz-errors'; commit(); return; }
  const mode = aiMode();
  d.tab = 'assistant'; AI.busy = true;
  pushMsg({ role: 'user', text: 'Generate a plan from my inputs.' });
  const pending = pushMsg({ role: 'assistant', source: mode, pending: true });
  commit();
  try {
    let res;
    if (mode === 'live') res = await callLive('generate');
    else { await sleep(900); res = simGenerate(d); }
    d.chat = d.chat.filter((m) => m.id !== pending.id);
    if (res.error) pushMsg({ role: 'assistant', source: 'simulated', text: res.error, error: true });
    else {
      d.plan = res.plan; d.planMeta = { source: mode, at: Date.now() }; d.revised = []; d.editing = false; d.labId = null;
      const r = computeResources(d.plan, d);
      pushMsg({ role: 'assistant', source: mode, text: res.reply, check: r.issues.length ? [`${plural(r.issues.length, 'item')} flagged for your decision.`] : [] });
    }
  } catch (e) {
    d.chat = d.chat.filter((m) => m.id !== pending.id);
    if (e && ['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(e.code)) AI.denied = true;
    pushMsg({ role: 'assistant', source: 'live', text: liveErrorText(e), error: e && e.code !== 'cancelled' });
  } finally { AI.busy = false; AI.ctl = null; commit(); }
}

async function designerAsk(question) {
  const d = S.designer;
  question = String(question || '').trim();
  if (!question || !d.plan || AI.busy) return;
  const mode = aiMode();
  d.draftMsg = ''; d.tab = 'assistant'; AI.busy = true;
  pushMsg({ role: 'user', text: question });
  const pending = pushMsg({ role: 'assistant', source: mode, pending: true });
  commit();
  try {
    const res = mode === 'live' ? await callLive('revise', question) : (await sleep(700), simRevise(d, question));
    d.chat = d.chat.filter((m) => m.id !== pending.id);
    applyRevision(res, mode);
  } catch (e) {
    d.chat = d.chat.filter((m) => m.id !== pending.id);
    if (e && ['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(e.code)) AI.denied = true;
    pushMsg({ role: 'assistant', source: 'live', text: liveErrorText(e), error: e && e.code !== 'cancelled' });
  } finally { AI.busy = false; AI.ctl = null; commit(); }
}

function applyRevision(res, source) {
  const d = S.designer; const old = d.plan; const oldRes = computeResources(old, d);
  if (res.groupSize && res.groupSize !== Number(d.logistics.groupSize) && res.groupSize >= 1 && res.groupSize <= 8) d.logistics.groupSize = res.groupSize;
  if (res.labMinutes && res.labMinutes > 0) d.logistics.labMinutes = res.labMinutes;
  for (const u of res.inventoryUpdates || []) {
    const item = d.inventory.find((i) => i.name.trim().toLowerCase() === String(u.name || '').trim().toLowerCase()) || d.inventory.find((i) => normName(i.name).some((w) => normName(u.name).includes(w)));
    if (item && Number.isFinite(+u.quantity) && +u.quantity >= 0) item.qty = +u.quantity;
  }
  if (res.plan) { d.revised = revisedSteps(old, res.plan); d.plan = res.plan; d.planMeta = { source, at: Date.now() }; }
  const check = planDiff(old, d.plan, oldRes, computeResources(d.plan, d));
  pushMsg({ role: 'assistant', source, text: res.reply, changes: res.changes || [], check });
}

function designerContent() {
  const d = S.designer; const p = clone(d.plan);
  return { ...p, setupMinutes: Number(d.logistics.setupMinutes) || 0, cleanupMinutes: Number(d.logistics.cleanupMinutes) || 0, groupSize: Number(d.logistics.groupSize) || 3 };
}
function designerSave(state = 'draft') {
  const d = S.designer; let lab = d.labId && labById(d.labId);
  if (!lab) { lab = newLab(designerContent(), 'ai'); d.labId = lab.id; if (state === 'ready') saveLabVersion(lab, designerContent(), 'ready'); }
  else saveLabVersion(lab, designerContent(), state);
  return lab;
}

async function importFile(file) {
  if (!file) return;
  U.importBusy = file.name; U.importFile = null; S.ui.importDraft = null; commit();

    const parsed = parseProcedureText(res.text);
    U.importFile = file;
    S.ui.importDraft = { stage: 'review', source: res.kind, file: { name: file.name, size: file.size, type: file.type || res.kind }, text: res.text, content: parsed.content, notes: parsed.notes };
  } catch (e) {

  } finally { U.importBusy = false; commit(); }
}

function saveImport(state) {

/* =====================================================================
   Live Progress: one card per group, pacing chart, group detail panel.
   Data source: S.progress + S.help, shaped like the realtime events a
   production backend would push from students' devices.
   ===================================================================== */
const shortGroup = (name) => { const m = /^bench\s*(\d+)/i.exec(name); return m ? `B${m[1]}` : initials(name); };
const naturalCmp = (a, b) => a.localeCompare(b, undefined, { numeric: true });

function liveView() {
  if (!myClasses().length) return html`<div class="card">${emptyState({ ico: 'activity', title: 'No classes yet', text: 'Create a class and assign a lab to see live progress here.', actions: html`<a class="btn btn-primary" href="#class-new">Create class</a>` })}</div>`;
  const ctx = ensureCtx(); const sess = sessionById(ctx.sessionId);
  if (!sess || sess.classId !== ctx.classId || (ctx.periodId && sess.periodId !== ctx.periodId)) {
    return html`<div class="card">${emptyState({ ico: 'calendar', title: 'No lab sessions here yet', text: 'Assign a lab to this class and period. Its session will appear in the selector above.', actions: html`<button class="btn btn-primary" data-action="assign-open" data-cid="${ctx.classId}">${icon('send')}Assign a lab</button>` })}</div>`;
  }
  const c = sessionContent(sess); const now = Date.now();
  const cls = classById(sess.classId); const lab = labById(sess.labId); const v = versionById(lab, sess.versionId);
  const ps = progressFor(sess.id);
  const statuses = new Map(ps.map((p) => [p.id, groupStatus(p, sess, c, now)]));
  const counts = Object.fromEntries(GROUP_STATUS_ORDER.map((k) => [k, 0]));
  statuses.forEach((s) => counts[s.key]++);
  const filter = S.ui.liveFilter || 'all';
  const sortKey = S.ui.liveSort || 'name';
  let list = ps.filter((p) => filter === 'all' || statuses.get(p.id).key === filter);
  list.sort((a, b) => {
    const ga = groupById(a.groupId), gb = groupById(b.groupId);
    if (sortKey === 'progress') return b.completed.length - a.completed.length || naturalCmp(ga.name, gb.name);
    if (sortKey === 'activity') return (a.lastActivityAt || 0) - (b.lastActivityAt || 0) || naturalCmp(ga.name, gb.name);
    return naturalCmp(ga.name, gb.name);
  });
  const elapsed = sessionElapsed(sess, now); const planned = plannedMinutes(c) * MIN;
  const groupsAvailable = groupsIn(sess.classId, sess.periodId).length;
  const openHelp = S.help.filter((h) => h.sessionId === sess.id && h.status !== 'resolved').length;
  return html`<div class="stack loose">
    <section class="card card-pad stack" aria-labelledby="ls-title">
      <div class="session-head">
        <div class="stack tight" style="min-width:0"><div class="row wrap">${sessionPill(sess.status)}<span class="tag">${icon('lock', 'sm')}Version ${v.number}</span></div>
          <h2 id="ls-title" style="font-size:1.4rem">${c.title}</h2><span class="small muted">${cls.name} · ${periodName(cls.id, sess.periodId)} · ${plural(ps.length || groupsAvailable, 'group')}</span></div>
        ${sess.status === 'scheduled' ? html`<div class="stack tight" style="align-items:flex-end"><span class="small muted">Scheduled ${sess.scheduledFor === todayISO() ? 'for today' : 'for ' + fmtDate(new Date(sess.scheduledFor + 'T12:00').getTime())} · ${plannedMinutes(c)} min planned</span>

            <div><div class="k">Elapsed</div><div class="v">${tickSession(sess, 'elapsed')}</div></div>
            <div><div class="k">${elapsed <= planned ? 'Planned time left' : 'Past planned time'}</div><div class="v">${tickSession(sess, 'remaining')}</div></div>
            <div><div class="k">Planned</div><div class="v">${plannedMinutes(c)} min</div></div></div>`}
        ${sess.status === 'active' ? html`<div class="row"><button class="btn" data-action="session-pause" data-sid="${sess.id}">${icon('pause')}Pause</button><button class="btn btn-danger" data-action="session-end-ask" data-sid="${sess.id}">${icon('stopCircle')}End session</button></div>`

function behindExplainer() {

  return html`<details class="explain"${attr(U.explainOpen, 'open')}><summary data-action="explain-toggle" aria-expanded="${!!U.explainOpen}">${icon('info', 'sm')}How “May Be Behind” works</summary>

      <p>A group is flagged when the session clock is more than <strong>${t} minutes</strong> past the planned finish of the step it’s on. Planned finish is setup time plus the step times up to that step.</p>
      <p class="small muted">It’s a prompt to check in, not a grade. A lost connection or a quiet group is never flagged as behind for that reason alone. Paused time doesn’t count.</p>
      <div class="row"><label class="small strong" for="behind-t">Flag after</label>
        <select class="select sm" id="behind-t" style="width:auto" data-bind="settings.behindMinutes" data-type="int">${options([2, 3, 5, 8, 10, 15].map((n) => [n, `${n} min past plan`]), t)}</select></div>
    </div>` : ''}</details>`;

function pacingChart(sess, c, ps, statuses, now) {
  const n = c.steps.length; const plannedIdx = plannedStepAt(c, sessionElapsed(sess, now));
  const cols = Array.from({ length: n + 1 }, () => []);
  ps.forEach((p) => cols[p.finishedAt ? n : p.stepIndex].push(p));
  const desc = cols.map((list, i) => `${i < n ? 'Step ' + (i + 1) : 'Finished'}: ${list.length ? list.map((p) => groupById(p.groupId).name).join(', ') : 'none'}`).join('; ');
  return html`<div class="pacing" role="img" aria-label="Pacing: where each group is. The plan expects groups on ${plannedIdx < n ? 'step ' + (plannedIdx + 1) : 'cleanup or done'} now. ${desc}.">
    <div class="row between wrap" style="margin-bottom:6px"><span class="eyebrow">Pacing</span><span class="xs muted">${plannedIdx < n ? html`Plan says step <strong>${plannedIdx + 1}</strong> by now (shaded)` : 'Plan says all steps should be done'}</span></div>
    <div class="pacing-cols" style="grid-template-columns:repeat(${n + 1}, minmax(0, 1fr))" aria-hidden="true">
      ${cols.map((list, i) => html`<div class="pacing-col ${i === plannedIdx ? 'planned' : ''}"><div class="pacing-stack">${list.map((p) => { const g = groupById(p.groupId); const st = GROUP_STATUS[statuses.get(p.id).key]; return html`<span class="pacing-dot tone-${st.tone}" title="${g.name}: ${st.label}">${shortGroup(g.name)}</span>`; })}</div>
        <span class="pacing-label">${i < n ? i + 1 : '✓'}</span></div>`)}
    </div></div>`;
}

/* Autoplay: random events across online groups in active sessions. */
function autoplayTick() {
  const sessions = mySessions().filter((s) => s.status === 'active');
  if (!sessions.length) return;
  const sess = sessions[Math.floor(Math.random() * sessions.length)];
  const ps = progressFor(sess.id).filter((p) => !p.finishedAt);
  if (!ps.length) return;
  const p = ps[Math.floor(Math.random() * ps.length)]; const g = groupById(p.groupId);
  const r = Math.random();
  if (p.connection === 'lost') { if (r < 0.5) { Sim.toggleConnection(p); toast(`${g.name} reconnected.`, 'wifi'); } return; }
  if (r < 0.55) { const res = Sim.advance(p, sess); if (res === 'requested') toast(`${g.name} is waiting for your checkpoint approval.`, 'clipboard'); }
  else if (r < 0.75) Sim.record(p, sess);
  else if (r < 0.88 && !openHelpForGroup(sess.id, p.groupId).length) { const cats = Object.keys(SAMPLE_HELP); const cat = cats[Math.floor(Math.random() * cats.length)]; Sim.help(p, sess, cat, SAMPLE_HELP[cat][Math.floor(Math.random() * SAMPLE_HELP[cat].length)]); toast(`${g.name} asked for help (${cat}).`, 'lifebuoy'); }
  else if (r < 0.92) { Sim.toggleConnection(p); }
}

/** Checkpoint status for a group: response, approval pending, or returned. */
function cpFlag(p, sess, c, wide = false) {
  const cp = checkpointById(c, p.atCheckpoint); if (!cp) return '';
  const st = Engine.gateState(classTrack(sess, p.groupId), cp);
  const label = st.waitingOn === 'approval' ? 'Approval pending' : st.waitingOn === 'revision' ? 'Returned for revision' : st.waitingOn === 'correct' ? 'Revising answers' : 'Working on response';
  const btn = st.approval === 'pending' ? html`<button class="btn btn-xs btn-primary" data-action="checkpoint-approve" data-pid="${p.id}">${icon('check', 'sm')}Approve</button>` : '';
  return wide ? html`<div class="panel row between wrap"><span>${icon('clipboard')} <strong>${cp.title}</strong> · ${label}</span>${btn}</div>`
    : html`<span class="pill tone-wait">${icon('clipboard')}${cp.title} · ${label}</span>${btn}`;
}

/* =====================================================================
   Bridge to the Student Assistant site (the "student assistant" folder).

   Labby has no server of its own yet, so this runs in the teacher's browser.
   While a session is active it publishes the lab under the class join code,
   with the period's lab groups as teams, then reads each team's progress back
   into LabSessionAPI so Live Progress and the Help Queue update for real.

   Everything goes through the session API, so repeats are safe: each write
   has a stable event ID.
   ===================================================================== */
const StudentSite = {
  KEY: 'labby.studentSite',
  POLL_MS: 3000,
  state: 'off', // off | connected | interrupted
  published: {}, // session id -> what was last sent
  helpOpen: new Set(),

  config() {
    try { return { url: 'http://localhost:8080', token: '', ...JSON.parse(localStorage.getItem(this.KEY) || '{}') }; }
    catch (e) { return { url: 'http://localhost:8080', token: '' }; }
  },
  saveConfig(next) {
    try { localStorage.setItem(this.KEY, JSON.stringify(next)); } catch (e) { /* storage unavailable */ }
    this.published = {};
  },
  asked() {
    try { return JSON.parse(localStorage.getItem(`${this.KEY}.asked`) || '{}'); } catch (e) { return {}; }
  },
  saveAsked(asked) {
    try { localStorage.setItem(`${this.KEY}.asked`, JSON.stringify(asked)); } catch (e) { /* storage unavailable */ }
  },

  async call(path, body) {
    const { url, token } = this.config();
    const res = await fetch(`${url.replace(/\/+$/, '')}/api/dashboard${path}`, {
      method: body ? 'POST' : 'GET',
      headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined,
    });
    if (!res.ok) throw new Error(`Student site returned ${res.status}`);
    return res.json();
  },

  /** The newest active session for each class, since students join by the class code. */
  sessions() {
    const byClass = new Map();
    S.sessions.filter((s) => s.status === 'active').forEach((s) => {
      const held = byClass.get(s.classId);
      if (!held || (s.startedAt || 0) > (held.startedAt || 0)) byClass.set(s.classId, s);
    });
    return [...byClass.values()];
  },

  labFor(sess) {
    const c = sessionContent(sess);
    const teams = progressFor(sess.id).map((p) => groupById(p.groupId)).filter(Boolean).map((g) => ({ id: g.id, name: g.name }));
    const steps = c.steps.map((s) => `${s.title}: ${s.instructions}`);
    const procedure = [
      c.title,
      c.objectives.length ? `Objectives: ${c.objectives.join('; ')}` : '',
      c.materials.length ? `Equipment: ${c.materials.map((m) => m.name).join(', ')}` : '',
      c.precautions.length ? `Safety: ${c.precautions.join('; ')}` : '',
      ...steps.map((text, i) => `${i + 1}. ${text}`),
    ].filter(Boolean).join('\n');
    return { code: classById(sess.classId).joinCode, procedure, teams, steps };
  },

  async publish(sess) {
    const lab = this.labFor(sess);
    const signature = JSON.stringify(lab);
    if (this.published[sess.id] === signature) return lab.code;
    await this.call('/labs', lab);
    this.published[sess.id] = signature;
    return lab.code;
  },

  /** Plan steps match Labby's steps one to one, so s3 is the third step. */
  stepAt(c, planStepId) {
    return c.steps[Number(String(planStepId).slice(1)) - 1] || null;
  },

  applyTeam(sess, c, team, students) {
    const t = LabSessionAPI.track(sess.id, team.id);
    if (!t) return false;
    const p = ensureProgressShape(t.p);
    let changed = false;

    p.connection = team.online > 0 ? 'online' : p.connection;

    for (const student of students) {
      const joined = `sa-join-${sess.id}-${student.id}`;
      if (!seenEvent(joined)) { markEvent(joined); logActivity(p, `${student.name} joined from the student site`); changed = true; }

      for (const m of student.measurements) {
        const step = this.stepAt(c, m.stepId);
        if (!step) continue;
        const res = LabSessionAPI.recordMeasurement({ eventId: `sa-m-${student.id}-${m.at}`, sessionId: sess.id, groupId: team.id, stepId: step.id, participantId: student.id, label: m.label, unit: m.unit, value: m.value });
        changed = changed || (res && res.status === 'ok');
      }

      for (const a of student.answers) {
        const key = `sa-a-${student.id}-${a.promptId}`;
        if (seenEvent(key)) continue;
        markEvent(key);
        logActivity(p, `${student.name} answered “${a.question}”: ${a.answer} (${a.correct ? 'correct' : 'needs review'})`, a.at);
        changed = true;
      }

      if (student.helpRequested && !this.helpOpen.has(student.id)) {
        this.helpOpen.add(student.id);
        const step = c.steps[Math.min(student.currentStep, c.steps.length - 1)];
        LabSessionAPI.requestHelp({ eventId: `sa-h-${student.id}-${Date.now()}`, sessionId: sess.id, groupId: team.id, participantId: student.id, category: 'Other', message: `${student.name} asked for you on step ${student.currentStep + 1}: ${step.title}` });
        changed = true;
      }
      if (!student.helpRequested) this.helpOpen.delete(student.id);

      if (student.alert) {
        const before = p.aiFlags.length;
        LabSessionAPI.flag({ sessionId: sess.id, groupId: team.id, kind: 'safety', text: student.alert, stepId: c.steps[p.stepIndex].id });
        changed = changed || p.aiFlags.length !== before;
      }
    }

    // A team moves as its furthest member does, one confirmed step at a time.
    for (let i = 0; i < team.stepsDone && i < c.steps.length; i++) {
      const stepId = c.steps[i].id;
      const res = LabSessionAPI.completeStep({ eventId: `sa-step-${sess.id}-${team.id}-${stepId}`, sessionId: sess.id, groupId: team.id, stepId, participantId: null });
      if (res.status === 'ok') changed = true;
      if (res.status === 'blocked') break;
    }

    return changed;
  },

  /** Teacher-written checkpoints reach students as questions; their answers go back through the session API. */
  async runCheckpoint(sess, c, team, code, students) {
    const t = LabSessionAPI.track(sess.id, team.id);
    const cp = t && t.p.atCheckpoint ? checkpointById(c, t.p.atCheckpoint) : null;
    if (!cp || cp.kind !== 'response' || !cp.questions.length) return false;

    const asked = this.asked();
    const responses = {};
    for (const q of cp.questions) {
      const key = `${team.id}:${cp.id}:${q.id}`;
      if (!asked[key]) {
        const choices = q.type === 'mc' ? ` Choices: ${q.options.map((o) => o.text).join(', ')}.` : '';
        const { sent } = await this.call(`/labs/${encodeURIComponent(code)}/prompts`, { question: `${q.prompt}${choices}`, teamIds: [team.id] });
        if (sent.length) { asked[key] = sent.map((s) => s.promptId); this.saveAsked(asked); }
        continue;
      }
      const reply = students.flatMap((s) => s.answers).find((a) => asked[key].includes(a.promptId));
      if (!reply) continue;
      if (q.type === 'mc') {
        const said = reply.answer.toLowerCase();
        const choice = q.options.find((o) => said.includes(o.text.toLowerCase()));
        if (choice) responses[q.id] = choice.id;
      } else if (q.type === 'numeric') {
        const number = reply.answer.match(/-?\d+(\.\d+)?/);
        if (number) responses[q.id] = number[0];
      } else responses[q.id] = reply.answer;
    }

    if (Object.keys(responses).length < cp.questions.length) return false;
    const res = LabSessionAPI.saveResponse({ eventId: `sa-cp-${sess.id}-${team.id}-${cp.id}`, sessionId: sess.id, groupId: team.id, checkpointId: cp.id, participantId: t.members[0] || null, responses, submit: true });
    return !!res && res.status === 'ok';
  },

  async tick() {
    if (typeof S === 'undefined' || !S || !this.config().token) { this.state = 'off'; return; }
    try {
      let changed = false;
      for (const sess of this.sessions()) {
        const c = sessionContent(sess);
        if (!c || !c.steps.length) continue;
        const code = await this.publish(sess);
        const { lab, students, teams } = await this.call(`/labs/${encodeURIComponent(code)}`);
        if (!lab.plan) continue;
        for (const team of teams) {
          if (!groupById(team.id)) continue;
          const members = students.filter((s) => s.teamId === team.id);
          if (this.applyTeam(sess, c, team, members)) changed = true;
          if (await this.runCheckpoint(sess, c, team, code, members)) changed = true;
        }
      }
      this.state = 'connected';
      if (changed) commit();
    } catch (e) {
      this.state = 'interrupted';
      console.warn(e);
    }
  },

  start() {
    if (this.timer) return;
    this.timer = setInterval(() => { this.tick(); }, this.POLL_MS);
  },

  card() {
    const { url, token } = this.config();
    const label = { off: 'Not connected', connected: 'Connected', interrupted: 'Connection interrupted' }[this.state];
    const live = this.sessions();
    return html`<section class="card card-pad stack" aria-labelledby="ss-h">
      <div class="row between"><h2 id="ss-h">Student site</h2><span class="hint">${label}</span></div>
      <p class="small muted">Students join with the class code. Each lab group’s progress then appears in Live Progress and the Help Queue while a session is active.</p>
      <div class="form-grid">
        <div class="field"><label class="label" for="ss-url">Address</label><input class="input" id="ss-url" value="${url}"></div>
        <div class="field"><label class="label" for="ss-token">Dashboard token</label><input class="input" id="ss-token" type="password" autocomplete="off" value="${token}"><span class="hint">Printed when the student site’s server starts.</span></div>
      </div>
      <div><button class="btn btn-primary" data-action="site-save">Save connection</button></div>
      ${live.length ? html`<div class="field"><label class="label" for="ss-question">Ask active classes a question</label><input class="input" id="ss-question" placeholder="Leave blank to have Gemma write one"></div>
      <div><button class="btn" data-action="site-ask">Send question</button></div>` : ''}
    </section>`;
  },

  actions: {
    'site-save': () => {
      StudentSite.saveConfig({ url: document.getElementById('ss-url').value.trim(), token: document.getElementById('ss-token').value.trim() });
      StudentSite.tick().then(() => { toast(StudentSite.state === 'connected' ? 'Connected to the student site.' : 'Couldn’t reach the student site. Check the address and token.', StudentSite.state === 'connected' ? 'check' : 'alert'); commit(); });
    },
    'site-ask': async () => {
      const question = document.getElementById('ss-question').value.trim();
      try {
        for (const sess of StudentSite.sessions()) await StudentSite.call(`/labs/${encodeURIComponent(classById(sess.classId).joinCode)}/prompts`, { question });
        toast('Question sent to students.', 'check');
      } catch (e) { toast('Couldn’t reach the student site.', 'alert'); }
    },
  },
};
StudentSite.start();

/* ---------- Bindings ---------- */
const BIND_HOOKS = {
  'U.modal.classId': () => { U.modal.periodIds = []; U.modal.error = ''; },
  'U.modal.labId': () => { U.modal.error = ''; },
  'U.modal.ok': () => { U.modal.error = ''; },
};
function applyBind(el) {
  const path = el.dataset.bind; const type = el.dataset.type || 'str';
  if (el.type === 'radio' && !el.checked) return;
  let v;
  switch (type) {
    case 'bool': v = el.checked; break;
    case 'int': v = el.value === '' ? '' : parseInt(el.value, 10); if (Number.isNaN(v)) v = ''; break;
    case 'num': v = el.value === '' ? '' : parseFloat(el.value); if (Number.isNaN(v)) v = ''; break;
    case 'numOrNull': v = el.value === '' ? null : Number(el.value); if (Number.isNaN(v)) v = null; break;
    case 'csv': v = el.value.split(',').map((s) => s.trim()).filter(Boolean); break;
    default: v = el.value;
  }
  if (path.startsWith('U.')) setPath(U, path.slice(2), v); else setPath(S, path, v);
  if (BIND_HOOKS[path]) BIND_HOOKS[path]();
  if (path.startsWith('designer.form') || path.startsWith('designer.logistics')) S.designer.errors = [];
  commit();
}

  'regen-confirm': (el) => { const c = classById(el.dataset.cid); const old = c.joinCode; c.joinCode = newJoinCode(); c.codeUpdatedAt = Date.now(); U.modal = null; commit(); toast(`New code ${c.joinCode}. ${old} no longer works.`, 'key'); },
  'class-tab': (el) => { S.ui.classTab = el.dataset.tab; commit(); },
  'class-period': (el) => { S.ui.classPeriod[el.dataset.cid] = el.dataset.pid; commit(); },
  'class-period-go': (el) => { S.ui.classPeriod[el.dataset.cid] = el.dataset.pid; S.ui.classTab = 'roster'; },
  'sim-join': (el) => {
    const FIRST = ['Riley', 'Amir', 'Lena', 'Marcus', 'Ines', 'Tomas', 'Keiko', 'Sade', 'Victor', 'Hazel'], LAST = ['Okoro', 'Vargas', 'Brennan', 'Choi', 'Delgado', 'Weiss', 'Nakamura', 'Ahmed'];
    const st = { id: uid(), name: `${FIRST[Math.floor(Math.random() * FIRST.length)]} ${LAST[Math.floor(Math.random() * LAST.length)]}` };
    S.students.push(st); S.enrollments.push({ id: uid(), classId: el.dataset.cid, periodId: el.dataset.pid, studentId: st.id, joinedAt: Date.now() });
    commit(); toast(`Demo: ${st.name} joined ${periodName(el.dataset.cid, el.dataset.pid)} with the class code.`, 'zap');
  },

  'group-add': (el) => { const gs = groupsIn(el.dataset.cid, el.dataset.pid); S.groups.push({ id: uid(), classId: el.dataset.cid, periodId: el.dataset.pid, name: `Bench ${gs.length + 1}`, memberIds: [] }); commit(); },
  'assign-open': (el) => {

  'flag-go': (el) => { const c = getPath(S, el.dataset.path.replace(/^/, '')); const id = flagTargetId(el.dataset.path, el.dataset.field, c); if (id) U.focusAfter = '#' + id; commit(); },
  /* designer */
  'designer-tab': (el) => { S.designer.tab = el.dataset.tab; commit(); },
  'fold': (el) => { const k = el.dataset.fold; S.designer.folds[k] = !S.designer.folds[k]; commit(); },
  'inv-add': () => { S.designer.inventory.push({ id: uid(), name: '', qty: null, unit: '', kind: 'reusable', notes: '' }); commit(); U.focusAfter = `#inv-${S.designer.inventory.length - 1}-name`; },

  'designer-save': () => { const lab = designerSave('draft'); commit(); toast(`Saved “${labTitle(lab)}” as a draft in your library.`); },
  'designer-preview': () => { U.modal = { type: 'preview', content: designerContent(), sub: 'Draft plan from the Lab Designer' }; commit(); },
  'designer-assign': () => { U.modal = { type: 'review', ok: false }; commit(); },
  'review-confirm': () => {

    if (errs.length) { U.modal.error = errs[0] + ' Use Edit manually to fix it.'; commit(); return; }
    const lab = designerSave('ready');

  /* library + import + editor */
  'new-manual': () => newManualLab(),
  'lib-status': (el) => { S.ui.libStatus = el.dataset.status; commit(); },

  'lab-duplicate': (el) => { const src = labById(el.dataset.lid); const c = clone(latestVersion(src).content); c.title = `${c.title} (copy)`; c.steps.forEach((s) => { s.id = uid(); }); c.materials.forEach((m) => { m.id = uid(); }); const lab = newLab(c, 'duplicate'); S.ui.libStatus = 'all'; commit(); toast(`Duplicated as “${c.title}” (draft).`, 'copy'); return lab; },
  'lab-archive': (el) => { const lab = labById(el.dataset.lid); lab.archived = el.dataset.on === '1'; lab.updatedAt = Date.now(); commit(); toast(lab.archived ? `Archived “${labTitle(lab)}”. Find it under Archived. Assigned sessions aren’t affected.` : `Restored “${labTitle(lab)}”.`, lab.archived ? 'archive' : 'reopen'); },
  'import-paste': () => importText(S.ui.pasteText || '', 'paste'),
  'import-sample': () => importText(SAMPLE_IMPORT_TEXT, 'sample'),
  'import-discard': () => { S.ui.importDraft = null; U.importFile = null; commit(); toast('Import discarded.'); },
  'import-save': (el) => saveImport(el.dataset.state),
  'editor-save': (el) => editorSave(el.dataset.state),
  'editor-discard': () => { S.ui.editorDraft = null; commit(); toast('Changes discarded.'); },
  'editor-preview': () => { U.modal = { type: 'preview', content: S.ui.editorDraft.content }; commit(); },
  /* live */
  'session-start': (el) => { const s = sessFromEl(el); if (!startSession(s)) { toast('Arrange this period into lab groups before starting.', 'alert'); return; } commit(); toast('Session started. Groups can begin step 1.', 'play'); },
  'session-pause': (el) => { pauseSession(sessFromEl(el)); commit(); toast('Session paused. Timers are frozen.', 'pause'); },
  'session-resume': (el) => { resumeSession(sessFromEl(el)); commit(); toast('Session resumed.', 'play'); },
  'session-end-ask': (el) => { U.modal = { type: 'end', sid: el.dataset.sid }; commit(); },
  'session-end': (el) => { endSession(sessFromEl(el)); U.modal = null; commit(); toast('Session ended. Results are kept.', 'stopCircle'); },
  'live-filter': (el) => { S.ui.liveFilter = el.dataset.f; commit(); },
  'explain-toggle': () => { U.explainOpen = !U.explainOpen; commit(); },
  'group-open': (el) => { U.drawer = el.dataset.pid; commit(); },
  'drawer-close': () => { U.drawer = null; commit(); },
  'checkpoint-approve': (el) => { const p = progFromEl(el); if (!p || !p.atCheckpoint) return; approveCheckpoint(p); commit(); toast(`Approved. ${groupById(p.groupId).name} can continue.`, 'check'); },
  'demo-toggle': () => { U.demoOpen = !U.demoOpen; commit(); },
  'demo-advance': (el) => {
    const p = progFromEl(el); const sess = sessionById(p.sessionId); const g = groupById(p.groupId);
    const r = Sim.advance(p, sess);
    const msg = { finished: `${g.name} has already finished.`, offline: `${g.name}’s device is offline. Reconnect it first.`, checkpoint: `${g.name} is waiting for your checkpoint approval.`, started: `${g.name} started step 1.`, requested: `${g.name} asked you to check “${sessionContent(sess).steps[p.stepIndex].title}”.`, advanced: p.finishedAt ? `${g.name} finished the lab.` : `${g.name} moved to step ${p.stepIndex + 1}.` }[r] || `${g.name}: checkpoint updated.`;
    commit(); toast(msg, 'zap');
  },
  'demo-record': (el) => { const p = progFromEl(el); const sess = sessionById(p.sessionId); if (p.connection === 'lost') { toast('That device is offline. Reconnect it first.', 'wifiOff'); return; } const ok = Sim.record(p, sess); commit(); toast(ok ? `${groupById(p.groupId).name} recorded a measurement.` : 'Every measurement for this step is already recorded.', 'ruler'); },
  'demo-conn': (el) => { const p = progFromEl(el); Sim.toggleConnection(p); commit(); },
  /* help */
  'help-scope': (el) => { S.ui.helpScope = el.dataset.scope; commit(); },
  'help-tab': (el) => { S.ui.helpTab = el.dataset.tab; commit(); },
  'help-view': (el) => { U.hqOpen[el.dataset.hid] = !U.hqOpen[el.dataset.hid]; commit(); },
  'help-start': (el) => { const h = byId(S.help, el.dataset.hid); helpSetStatus(h, 'helping'); commit(); toast(`Helping ${groupById(h.groupId).name}. They keep their place in line.`, 'users'); },
  'help-resolve': (el) => { const h = byId(S.help, el.dataset.hid); helpSetStatus(h, 'resolved'); commit(); toast(`Resolved ${groupById(h.groupId).name}’s request. It moved to Resolved history.`, 'check'); },
  'help-reopen': (el) => { const h = byId(S.help, el.dataset.hid); const dup = S.help.find((x) => x.id !== h.id && x.sessionId === h.sessionId && x.groupId === h.groupId && x.category === h.category && x.status !== 'resolved'); if (dup) { toast(`${groupById(h.groupId).name} already has an open ${h.category.toLowerCase()} request. Update that one instead.`, 'alert'); return; } helpSetStatus(h, 'waiting'); S.ui.helpTab = 'open'; commit(); toast('Reopened at its original place in the queue.', 'reopen'); },
  'help-open-group': (el) => { const h = byId(S.help, el.dataset.hid); const p = S.progress.find((x) => x.sessionId === h.sessionId && x.groupId === h.groupId); openSession(h.sessionId, 'live'); if (p) { U.drawer = p.id; commit(); } },
};
const CHANGES = {
  'demo-role': (el) => {
    const v = el.value;
    if (v === 'out') { S.currentUserId = null; commit(); go('signup'); return; }
    if (v === 'own') return;
    const u = S.users.find((x) => x.demo && x.role === v); S.currentUserId = u.id; commit(); go(homeFor(u.role));
  },
  'ctx-class': (el) => { setCtxClass(el.value); U.drawer = null; commit(); },
  'ctx-period': (el) => { setCtxPeriod(el.value); U.drawer = null; commit(); },
  'ctx-session': (el) => { if (el.value) { setCtxSession(el.value); U.drawer = null; commit(); } },
  'student-group': (el) => {
    const { sid, cid, pid } = el.dataset;
    groupsIn(cid, pid).forEach((g) => { g.memberIds = g.memberIds.filter((m) => m !== sid); });
    const g = groupById(el.value); if (g) g.memberIds.push(sid);
    commit();
  },
  'mat-basis': (el) => { const m = getPath(S, el.dataset.path); const v = el.value; if (v === 'student') { m.per = 'student'; m.sharedBy = 1; } else { m.per = 'group'; m.sharedBy = v.startsWith('share') ? +v.slice(5) : 1; } commit(); },
  'cp-toggle': (el) => { const c = getPath(S, el.dataset.path); normalizeContent(c); const ex = checkpointAfter(c, el.dataset.sid); if (ex) c.checkpoints = c.checkpoints.filter((x) => x !== ex); else { const st = c.steps.find((x) => x.id === el.dataset.sid); c.checkpoints.push({ ...blankCheckpoint(el.dataset.sid), title: `Teacher check: ${st ? st.title : 'step'}`, kind: 'info', responseRequired: false, approvalRequired: true, questions: [] }); } commit(); },
  'import-file': (el) => { const f = el.files && el.files[0]; el.value = ''; importFile(f); },
  'demo-cat': (el) => { S.ui.demoCat = el.value; S.ui.demoMsg = SAMPLE_HELP[el.value][0]; commit(); },
};
const SUBMITS = {
  signin: () => submitSignin(),
  signup: () => submitSignup(),
  'create-class': () => submitCreateClass(),
  'designer-ask': () => designerAsk(S.designer.draftMsg),
  'demo-help': () => {
    const sess = sessionById(S.ui.ctx.sessionId); const ps = progressFor(sess.id);
    const p = ps.find((x) => x.id === S.ui.demoGroupId) || ps[0];
    const cat = S.ui.demoCat || 'Equipment'; const msg = (S.ui.demoMsg ?? SAMPLE_HELP[cat][0]).trim();
    if (!msg) { toast('Type a message for the help request.', 'alert'); return; }
    const res = Sim.help(p, sess, cat, msg);
    S.ui.demoMsg = SAMPLE_HELP[cat][(SAMPLE_HELP[cat].indexOf(msg) + 1) % SAMPLE_HELP[cat].length];
    commit();
    toast(res.updated ? `${groupById(p.groupId).name} already had an open ${cat.toLowerCase()} request, so it was updated instead of duplicated.` : `${groupById(p.groupId).name} sent a ${cat.toLowerCase()} help request.`, 'lifebuoy');
  },
};

/* ---------- Event wiring ---------- */
function wireEvents() {
  document.addEventListener('click', (ev) => {
    if (U.menu && !ev.target.closest('.profile')) { U.menu = false; commit(); }
    if (U.explainOpen && !ev.target.closest('.explain')) { U.explainOpen = false; commit(); }
    const el = ev.target.closest('[data-action]');
    const control = ev.target.closest('input, select, textarea, label');
    if (el && control && control !== el && el.contains(control)) return; // let form controls inside clickable areas work normally
    if (!el || el.disabled || el.getAttribute('aria-disabled') === 'true' && el.tagName === 'BUTTON' && el.dataset.action !== 'live-filter') return;
    const fn = ACTIONS[el.dataset.action];
    if (!fn) return;
    if (el.tagName !== 'A' && el.tagName !== 'INPUT') ev.preventDefault();
    fn(el, ev);
  });
  document.addEventListener('input', (ev) => {
    const el = ev.target;
    if (el.dataset && el.dataset.bind && el.type !== 'checkbox' && el.type !== 'radio' && el.tagName !== 'SELECT') applyBind(el);
  });
  document.addEventListener('change', (ev) => {
    const el = ev.target; if (!el.dataset) return;
    if (el.dataset.bind && (el.type === 'checkbox' || el.type === 'radio' || el.tagName === 'SELECT')) applyBind(el);
    if (el.dataset.change && CHANGES[el.dataset.change]) CHANGES[el.dataset.change](el, ev);
  });
  document.addEventListener('submit', (ev) => {
    const f = ev.target.closest('form[data-submit]'); if (!f) return;
    ev.preventDefault(); const fn = SUBMITS[f.dataset.submit]; if (fn) fn(f);
  });
  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape') {
      if (U.modal) { U.modal = null; commit(); return; }
      if (U.drawer) { U.drawer = null; commit(); return; }
      if (U.menu) { U.menu = false; commit(); const b = document.querySelector('.profile-btn'); if (b) b.focus(); return; }
      if (U.explainOpen) { U.explainOpen = false; commit(); return; }
      if (U.navOpen) { U.navOpen = false; commit(); return; }
    }
    if (ev.key === 'Enter' && (ev.metaKey || ev.ctrlKey) && ev.target.id === 'dz-msg') { ev.preventDefault(); designerAsk(S.designer.draftMsg); }
    if (ev.key === 'Tab') {
      const box = document.querySelector('.modal') || document.querySelector('.drawer') || (U.navOpen && document.querySelector('.sidebar.open'));
      if (!box) return;
      const f = Array.from(box.querySelectorAll('a[href], button:not([disabled]), input:not([disabled]):not(.sr-only), select:not([disabled]), textarea:not([disabled]), [tabindex="0"]')).filter((x) => x.offsetParent !== null);
      if (!f.length) return;
      const first = f[0], last = f[f.length - 1];
      if (!box.contains(document.activeElement)) { ev.preventDefault(); first.focus(); }
      else if (ev.shiftKey && document.activeElement === first) { ev.preventDefault(); last.focus(); }
      else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
    }
  });
  document.addEventListener('dragover', (ev) => { if (U.route && U.route.name === 'import') { ev.preventDefault(); const over = !!ev.target.closest('#dropzone'); if (over !== U.dropOver) { U.dropOver = over; commit(); } } });
  document.addEventListener('dragleave', (ev) => { if (U.dropOver && !ev.relatedTarget) { U.dropOver = false; commit(); } });
  document.addEventListener('drop', (ev) => {
    if (!U.route || U.route.name !== 'import') return;
    ev.preventDefault(); U.dropOver = false;
    const f = ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files[0];
    if (f) importFile(f); else commit();
  });
  window.addEventListener('hashchange', () => { U.menu = false; U.navOpen = false; U.drawer = null; U.explainOpen = false; U.modal = U.modal && U.modal.type === 'assign' ? U.modal : null; commit(); });
}

/* ---------- Clocks ---------- */
let tickCount = 0;
function tick() {
  tickCount++;
  const now = Date.now();
  document.querySelectorAll('[data-tick]').forEach((el) => {
    let txt = el.textContent;
    const kind = el.dataset.tick;
    if (kind === 'since') { const t = +el.dataset.t; txt = el.dataset.fmt === 'ago' ? fmtAgo(t, now) : el.dataset.fmt === 'mins' ? fmtMins(now - t) : fmtTimer(now - t); }
    else if (kind === 'session') { const s = sessionById(el.dataset.sid); if (s) { const e = sessionElapsed(s, now); txt = el.dataset.what === 'elapsed' ? fmtTimer(e) : fmtTimer(plannedMinutes(sessionContent(s)) * MIN - e); } }
    else if (kind === 'step') { const p = S.progress.find((x) => x.id === el.dataset.pid); const s = p && sessionById(p.sessionId); if (p && s) txt = p.stepStartedAt && !p.finishedAt ? fmtTimer(stepTimeMs(p, s, now)) : '—'; }
    if (el.textContent !== txt) el.textContent = txt;
  });
  const user = me();
  if (user && user.role === 'teacher') {
    if (S.demo.autoplay && tickCount % 6 === 0) { autoplayTick(); commit(); }
    else if (tickCount % 15 === 0 && U.route && ['overview', 'live', 'help'].includes(U.route.name)) commit();
  }
}

/* ---------- Boot ---------- */
function boot() {
  loadState();
  initLiveAI();
  wireEvents();
  if (!location.hash) history.replaceState(null, '', '#' + (me() ? homeFor(me().role) : 'signin'));
  render();
  setInterval(tick, 1000);
}
boot();

</script>
