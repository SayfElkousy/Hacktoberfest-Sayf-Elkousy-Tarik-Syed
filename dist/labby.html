<title>Labby</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Labby: plan classroom labs with an AI assistant, assign them to class periods, follow each lab group live, and answer help requests in order.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout concept: persistent left rail + working canvas; dense, scannable cards for in-class use, roomier forms for prep. */
:root {
  --bg: #f7faf8;
  --surface: #ffffff;
  --surface-2: #f7faf8;
  --surface-3: #eef5f0;
  --ink: #17251d;
  --ink-2: #2e4036;
  --heading: #143d2b;
  --muted: #52645a;
  --line: #dce7df;
  --line-strong: #c3d4c9;
  --accent: #15803d;
  --accent-ink: #166534;
  --accent-soft: #ecfdf3;
  --accent-contrast: #ffffff;
  --blue: #1d5ba8;
  --blue-soft: #e2ecf9;
  --ok: #15803d;
  --ok-soft: #ecfdf3;
  --warn: #92400e;
  --warn-soft: #fef3c7;
  --bad: #b42318;
  --bad-soft: #fef0ee;
  --wait: #5f3dc4;
  --wait-soft: #ece7fb;
  --idle: #536266;
  --idle-soft: #e9eeef;
  --tape: #f6e7bd;
  --tape-ink: #5c4300;
  --focus: #15803d;
  --overlay: rgba(20, 61, 43, 0.4);
  --shadow: 0 1px 2px rgba(20, 61, 43, 0.06);
  --shadow-lg: 0 18px 40px rgba(20, 61, 43, 0.16), 0 2px 6px rgba(20, 61, 43, 0.06);
  --font-display: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --r-sm: 8px;
  --r: 12px;
  --r-lg: 16px;
  --sidebar-w: 252px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1618; --surface: #142024; --surface-2: #18272b; --surface-3: #1e3034;
    --ink: #e4eeef; --ink-2: #c2d2d4; --muted: #94a9ac; --line: #26393d; --line-strong: #33494e;
    --accent: #4ade80; --accent-ink: #86efac; --accent-soft: #14351f; --accent-contrast: #052e16; --heading: #d7f5e2;
    --blue: #86b4f2; --blue-soft: #172f4d; --ok: #63cc88; --ok-soft: #12321f; --warn: #f0b75c; --warn-soft: #382811;
    --bad: #f38b7f; --bad-soft: #3c1a16; --wait: #bba6f6; --wait-soft: #282043; --idle: #a6b4b7; --idle-soft: #213034;
    --tape: #3a3015; --tape-ink: #f1d98e; --focus: #4ade80; --overlay: rgba(0, 0, 0, 0.6);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.35); --shadow-lg: 0 18px 40px rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1618; --surface: #142024; --surface-2: #18272b; --surface-3: #1e3034;
  --ink: #e4eeef; --ink-2: #c2d2d4; --muted: #94a9ac; --line: #26393d; --line-strong: #33494e;
  --accent: #4ade80; --accent-ink: #86efac; --accent-soft: #14351f; --accent-contrast: #052e16; --heading: #d7f5e2;
  --blue: #86b4f2; --blue-soft: #172f4d; --ok: #63cc88; --ok-soft: #12321f; --warn: #f0b75c; --warn-soft: #382811;
  --bad: #f38b7f; --bad-soft: #3c1a16; --wait: #bba6f6; --wait-soft: #282043; --idle: #a6b4b7; --idle-soft: #213034;
  --tape: #3a3015; --tape-ink: #f1d98e; --focus: #4ade80; --overlay: rgba(0, 0, 0, 0.6);
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.35); --shadow-lg: 0 18px 40px rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { margin: 0; text-wrap: balance; color: var(--heading); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
h1, h2 { font-family: var(--font-display); letter-spacing: -0.01em; }
h1 { font-size: 1.6rem; font-weight: 700; line-height: 1.2; }
h2 { font-size: 1.15rem; font-weight: 650; line-height: 1.3; }
h3 { font-size: 1rem; font-weight: 700; }
p { margin: 0; }
a { color: var(--accent-ink); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 0.86rem; }
.xs { font-size: 0.78rem; }
.strong { font-weight: 700; }
.eyebrow { font-size: 0.74rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.ico { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -3px; }
.ico.sm { width: 15px; height: 15px; vertical-align: -2px; }
.ico.lg { width: 22px; height: 22px; }
.row { display: flex; align-items: center; gap: 8px; }
.row.wrap { flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.row.top { align-items: flex-start; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack.tight { gap: 6px; }
.stack.loose { gap: 20px; }
.grow { flex: 1 1 auto; min-width: 0; }
.spacer { flex: 1; }

/* ---------- Demo band ---------- */
.demo-band {
  background: repeating-linear-gradient(135deg, var(--tape) 0 14px, color-mix(in srgb, var(--tape) 82%, var(--tape-ink)) 14px 28px);
  color: var(--tape-ink);
  border-bottom: 1px solid color-mix(in srgb, var(--tape-ink) 25%, transparent);
  font-size: 0.84rem;
}
.demo-band-inner {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding-block: 6px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.demo-tag {
  display: inline-flex; align-items: center; gap: 5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; font-size: 0.72rem;
  background: var(--tape-ink); color: var(--tape); padding: 2px 8px; border-radius: 4px;
}
.demo-band .demo-text { flex: 1 1 260px; min-width: 0; }
.demo-band .demo-text.short { display: none; }
.demo-band select, .demo-band .btn { font-size: 0.8rem; }
.demo-band label { font-weight: 700; }
.demo-switch { display: inline-flex; align-items: center; gap: 6px; }
.demo-switch select { background: var(--surface); color: var(--ink); border: 1px dashed var(--tape-ink); border-radius: 6px; padding: 3px 6px; }

/* ---------- App shell ---------- */
.app { display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); min-height: calc(100dvh - 34px); }
.sidebar {
  position: sticky; top: env(safe-area-inset-top, 0px); align-self: start;
  height: calc(100dvh - env(safe-area-inset-top, 0px));
  background: var(--surface); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 4px;
  padding-block: 18px 14px;
  padding-left: max(14px, env(safe-area-inset-left, 0px));
  padding-right: 14px;
  overflow-y: auto;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px 16px; text-decoration: none; color: var(--ink); }
.brand-mark { width: 34px; height: 34px; border-radius: 10px; background: var(--accent); color: var(--accent-contrast); display: grid; place-items: center; }
.brand-mark svg { width: 22px; height: 22px; }
.brand-name { font-family: var(--font-display); font-weight: 800; font-size: 1.35rem; letter-spacing: -0.02em; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a {
  display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: 10px;
  color: var(--ink-2); text-decoration: none; font-weight: 700; font-size: 0.95rem;
}
.nav a:hover { background: var(--surface-3); color: var(--ink); }
.nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent-ink); }
.nav .badge { margin-left: auto; }
.nav-section { margin-top: 10px; padding: 6px 10px 4px; }
.sidebar-foot { margin-top: auto; padding: 12px 8px 0; border-top: 1px solid var(--line); }
.badge {
  display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 22px; padding: 0 7px;
  border-radius: 999px; background: var(--wait); color: var(--surface); font-size: 0.78rem; font-weight: 700; font-variant-numeric: tabular-nums;
}
.badge.zero { background: var(--surface-3); color: var(--muted); }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.topbar-inner {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
@media (min-width: 961px) { .topbar-inner { padding-left: 28px; padding-right: max(28px, env(safe-area-inset-right, 0px)); } }
.topbar h1 { font-size: 1.35rem; }
.ctx { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ctx label { font-size: 0.76rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.ctx .select { width: auto; min-width: 0; max-width: 240px; padding-block: 6px; }
.ctx #ctx-session { max-width: 340px; }
.topbar .menu-btn { display: none; }
h1[tabindex="-1"]:focus, main[tabindex="-1"]:focus { outline: none; }
.content {
  padding-block: 22px 60px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  width: 100%; max-width: 1360px;
}
@media (min-width: 961px) { .content { padding-left: 28px; padding-right: max(28px, env(safe-area-inset-right, 0px)); } }
.content:focus { outline: none; }
.page-intro { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.page-intro p { max-width: 64ch; color: var(--muted); }

.profile { position: relative; margin-left: auto; }
.avatar {
  width: 34px; height: 34px; border-radius: 50%; background: var(--blue-soft); color: var(--blue);
  display: grid; place-items: center; font-weight: 700; font-size: 0.85rem; flex: none;
}
.avatar.sm { width: 26px; height: 26px; font-size: 0.7rem; }
.profile-btn { display: flex; align-items: center; gap: 8px; background: transparent; border: 1px solid transparent; border-radius: 999px; padding: 3px 8px 3px 3px; cursor: pointer; }
.profile-btn:hover { background: var(--surface-3); }
.menu {
  position: absolute; right: 0; top: calc(100% + 6px); z-index: 40; width: 250px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow-lg); padding: 6px;
}
.menu-head { padding: 10px 10px 8px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
.menu-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; border-radius: 8px; background: none; border: 0; cursor: pointer; text-align: left; color: var(--ink); text-decoration: none; font-size: 0.93rem; }
.menu-item:hover, .menu-item:focus-visible { background: var(--surface-3); }

/* Mobile nav */
@media (max-width: 960px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .sidebar { display: none; }
  .sidebar.open {
    display: flex; position: fixed; inset: 0 auto 0 0; z-index: 60; width: min(300px, 86vw); height: 100dvh;
    padding-top: max(18px, env(safe-area-inset-top, 0px)); box-shadow: var(--shadow-lg);
  }
  .topbar .menu-btn { display: inline-flex; }
  .topbar .ctx { order: 5; }
  .demo-band .demo-text.long { display: none; }
  .demo-band .demo-text.short { display: inline; }
  .scrim { position: fixed; inset: 0; background: var(--overlay); z-index: 55; }
  .topbar h1 { font-size: 1.15rem; }
  .ctx { width: 100%; }
  .ctx .select { flex: 1 1 140px; max-width: none; }
}

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 38px;
  padding: 7px 14px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface);
  color: var(--ink); font-weight: 700; font-size: 0.92rem; cursor: pointer; text-decoration: none; white-space: nowrap;
}
.btn:hover { background: var(--surface-3); }
.btn:disabled, .btn[aria-disabled="true"] { opacity: 0.55; cursor: not-allowed; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-contrast); }
.btn-primary:hover { background: var(--accent-ink); border-color: var(--accent-ink); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn-ghost:hover { background: var(--surface-3); }
.btn-danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.btn-danger:hover { background: var(--bad-soft); }
.btn-danger.solid { background: var(--bad); color: var(--surface); border-color: var(--bad); }
.btn-sm { min-height: 32px; padding: 4px 10px; font-size: 0.85rem; border-radius: 8px; }
.btn-xs { min-height: 28px; padding: 2px 8px; font-size: 0.8rem; border-radius: 7px; gap: 5px; }
.btn-icon { width: 38px; padding: 0; }
.btn-icon.btn-sm { width: 32px; }
.btn-demo { border-style: dashed; border-color: var(--tape-ink); color: var(--tape-ink); background: var(--tape); }
.btn-demo:hover { background: color-mix(in srgb, var(--tape) 80%, var(--tape-ink)); }
.btn-ai { background: var(--blue); border-color: var(--blue); color: var(--surface); }
.btn-ai:hover { filter: brightness(0.92); background: var(--blue); }
.link-btn { background: none; border: 0; padding: 0; color: var(--accent-ink); font-weight: 700; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }

/* ---------- Forms ---------- */
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > label, .label { font-weight: 700; font-size: 0.88rem; color: var(--ink-2); }
.label .opt { font-weight: 400; color: var(--muted); }
.input, .select, .textarea {
  width: 100%; min-width: 0; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
  border-radius: 9px; padding: 8px 11px; font-size: 0.95rem;
}
.textarea { min-height: 84px; resize: vertical; line-height: 1.45; }
.input:focus, .select:focus, .textarea:focus { outline: 3px solid color-mix(in srgb, var(--focus) 55%, transparent); outline-offset: 0; border-color: var(--focus); }
.input[aria-invalid="true"], .select[aria-invalid="true"], .textarea[aria-invalid="true"] { border-color: var(--bad); background: color-mix(in srgb, var(--bad-soft) 45%, var(--surface)); }
.input.num-in { width: 84px; }
.input.sm, .select.sm { padding: 5px 8px; font-size: 0.88rem; border-radius: 7px; }
.hint { font-size: 0.82rem; color: var(--muted); }
.err { font-size: 0.84rem; color: var(--bad); font-weight: 700; display: flex; gap: 6px; align-items: flex-start; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.form-grid .span-2 { grid-column: 1 / -1; }
@media (max-width: 640px) { .form-grid { grid-template-columns: minmax(0, 1fr); } }
.check { display: flex; align-items: flex-start; gap: 9px; cursor: pointer; font-size: 0.93rem; }
.check input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--accent); flex: none; }
.error-summary { border: 1px solid var(--bad); background: var(--bad-soft); color: var(--ink); border-radius: var(--r); padding: 12px 14px; }
.error-summary ul { margin: 6px 0 0; padding-left: 20px; }

/* ---------- Cards / surfaces ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); }
.card-pad { padding: 18px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.card-body { padding: 16px 18px; }
.card-foot { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.panel { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
.divider { height: 1px; background: var(--line); border: 0; margin: 4px 0; }
.grid { display: grid; gap: 16px; }
.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid-main-side { grid-template-columns: minmax(0, 1.65fr) minmax(300px, 1fr); }
@media (max-width: 1180px) { .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 1080px) { .grid-main-side { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 720px) { .grid-2, .grid-3 { grid-template-columns: minmax(0, 1fr); } }

/* ---------- Pills / status ---------- */
.pill {
  display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px 2px 7px; border-radius: 999px;
  font-size: 0.8rem; font-weight: 700; white-space: nowrap; border: 1px solid transparent; line-height: 1.5;
}
.pill .ico { width: 14px; height: 14px; vertical-align: 0; }
.tone-idle { background: var(--idle-soft); color: var(--idle); }
.tone-blue { background: var(--blue-soft); color: var(--blue); }
.tone-warn { background: var(--warn-soft); color: var(--warn); }
.tone-wait { background: var(--wait-soft); color: var(--wait); }
.tone-ok { background: var(--ok-soft); color: var(--ok); }
.tone-bad { background: var(--bad-soft); color: var(--bad); }
.tone-accent { background: var(--accent-soft); color: var(--accent-ink); }
.tone-lost { background: var(--surface-3); color: var(--ink-2); border-color: var(--line-strong); border-style: dashed; }
.tag { display: inline-flex; align-items: center; gap: 4px; padding: 1px 7px; border-radius: 6px; font-size: 0.76rem; font-weight: 700; background: var(--surface-3); color: var(--ink-2); white-space: nowrap; }
.tag.sim { background: var(--tape); color: var(--tape-ink); border: 1px dashed color-mix(in srgb, var(--tape-ink) 60%, transparent); }
.tag.live { background: var(--blue-soft); color: var(--blue); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line-strong);
  background: var(--surface); font-weight: 700; font-size: 0.85rem; cursor: pointer; color: var(--ink-2);
}
.chip:hover { background: var(--surface-3); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.stack > .pill, .stack.tight > .pill { align-self: flex-start; }
.chip .count { font-variant-numeric: tabular-nums; opacity: 0.8; font-weight: 400; }

/* ---------- Tabs ---------- */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab {
  background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 14px 9px; font-weight: 700; color: var(--muted);
  cursor: pointer; white-space: nowrap; display: inline-flex; gap: 7px; align-items: center;
}
.tab[aria-selected="true"] { color: var(--accent-ink); border-bottom-color: var(--accent); }
.tab:hover { color: var(--ink); }

/* ---------- Tables ---------- */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 0.92rem; }
th { text-align: left; font-size: 0.76rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 700; padding: 10px 12px; background: var(--surface-2); border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tfoot td { font-weight: 700; background: var(--surface-2); }
tr.clickable { cursor: pointer; }
tr.clickable:hover td { background: var(--surface-2); }

/* ---------- Progress ---------- */
.segs { display: flex; gap: 3px; height: 10px; }
.seg { flex: 1; border-radius: 3px; background: var(--surface-3); border: 1px solid var(--line); }
.seg.done { background: var(--accent); border-color: var(--accent); }

.threshold { display: inline-flex; align-items: center; gap: 6px; font-size: 0.86rem; }

.explain-pop { position: absolute; z-index: 30; right: 0; top: calc(100% + 6px); width: min(360px, 86vw); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow-lg); padding: 14px; font-size: 0.9rem; display: flex; flex-direction: column; gap: 8px; }

.demo-panel > summary { list-style: none; cursor: pointer; padding: 12px 16px; display: flex; align-items: center; gap: 10px; font-weight: 700; color: var(--tape-ink); }
.demo-panel > summary::-webkit-details-marker { display: none; }
.demo-panel .demo-body { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 12px; }

.obs-table td, .obs-table th { padding: 6px 8px; font-size: 0.86rem; }
.done-steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 0.9rem; }
.done-steps li { display: flex; gap: 8px; align-items: center; }
.done-steps .ico { color: var(--ok); }

.hq { display: flex; flex-direction: column; gap: 10px; }
.hq-item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); }
.hq-item.helping { border-color: color-mix(in srgb, var(--blue) 55%, var(--line)); }
.hq-item.long { border-left: 4px solid var(--warn); }
.hq-main { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; gap: 14px; padding: 14px 16px; align-items: start; }

.hq-item.resolved .hq-pos { background: var(--surface-3); color: var(--muted); }
.hq-msg { font-size: 0.98rem; margin-top: 4px; }
.hq-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.84rem; color: var(--muted); margin-top: 6px; }
.hq-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; align-items: center; }
.hq-wait { font-family: var(--font-mono); font-weight: 600; font-variant-numeric: tabular-nums; }
.hq-detail { border-top: 1px solid var(--line); padding: 12px 16px 14px 76px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }

.plan-list { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 640px) { .plan-list { grid-template-columns: minmax(0, 1fr); } }
.plan-list li { border: 1px dashed var(--line-strong); border-radius: var(--r); padding: 12px 14px; background: var(--surface); display: flex; gap: 10px; }

.kbd { font-family: var(--font-mono); font-size: 0.78rem; border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; }
.hide-sm { }
@media (max-width: 640px) { .hide-sm { display: none !important; } }

const FileVault = {
  db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);

      try {
        const req = indexedDB.open('labby-files', 1);
        req.onupgradeneeded = () => req.result.createObjectStore('files');
        req.onsuccess = () => { this.db = req.result; resolve(this.db); };
        req.onerror = () => reject(req.error);
      } catch (e) { reject(e); }

  },
  async put(key, blob) { const db = await this.open(); return new Promise((res, rej) => { const tx = db.transaction('files', 'readwrite'); tx.objectStore('files').put(blob, key); tx.oncomplete = () => res(true); tx.onerror = () => rej(tx.error); }); },
  async get(key) { const db = await this.open(); return new Promise((res, rej) => { const tx = db.transaction('files', 'readonly'); const r = tx.objectStore('files').get(key); r.onsuccess = () => res(r.result || null); r.onerror = () => rej(r.error); }); },
};

/* ---------- Lookups (scoped to the signed-in teacher) ---------- */

function labStatus(lab) {
  if (lab.archived) return 'archived';

/* ---------- Session time ---------- */
/** The clock a session runs on: frozen while paused, stopped when completed. */
function sessionClock(sess, now = Date.now()) {
  if (sess.status === 'paused') return sess.pausedAt;
  if (sess.status === 'completed') return sess.endedAt || now;
  return now;
}
function sessionElapsed(sess, now = Date.now()) {
  if (!sess.startedAt || sess.status === 'scheduled') return 0;
  return Math.max(0, sessionClock(sess, now) - sess.startedAt - (sess.pausedTotal || 0));
}
const stepsMinutes = (c) => sum(c.steps.map((s) => s.minutes || 0));
const plannedMinutes = (c) => (c.setupMinutes || 0) + stepsMinutes(c) + (c.cleanupMinutes || 0);
/** Planned finish time (ms from session start) of each step. */
function plannedEnds(c) {
  let t = (c.setupMinutes || 0) * MIN;
  return c.steps.map((s) => (t += (s.minutes || 0) * MIN));
}
/** Index of the step the plan expects groups to be on right now. */
function plannedStepAt(c, elapsed) {
  const ends = plannedEnds(c);
  const i = ends.findIndex((e) => elapsed < e);
  return i === -1 ? c.steps.length : i;
}

/* ---------- Group status ---------- */
const openHelpForGroup = (sessionId, groupId) => S.help.filter((h) => h.sessionId === sessionId && h.groupId === groupId && h.status !== 'resolved');

/**
 * Derive a group's live status. Order matters: a lost connection is shown as
 * its own state and never counted as "behind"; missing activity alone never
 * marks a group as struggling.
 */
function groupStatus(p, sess, c, now = Date.now()) {
  const thresholdMs = (S.settings.behindMinutes || 5) * MIN;
  const elapsed = sessionElapsed(sess, now);
  const ends = plannedEnds(c);
  const out = { key: 'inProgress', behindMs: 0, plannedEnd: ends[p.stepIndex] };
  if (p.finishedAt) { out.key = 'completed'; return out; }
  if (p.connection === 'lost') { out.key = 'lost'; return out; }
  const gate = p.atCheckpoint && p.gates ? p.gates[p.atCheckpoint] : null;
  if ((gate && gate.approval === 'pending') || openHelpForGroup(sess.id, p.groupId).length) { out.key = 'waiting'; return out; }
  const pastPlan = elapsed - (ends[p.stepIndex] ?? ends[ends.length - 1] ?? 0);
  if (sess.status !== 'scheduled' && pastPlan > thresholdMs) { out.key = 'behind'; out.behindMs = pastPlan; return out; }
  if (!p.completed.length && !p.stepStartedAt) { out.key = 'notStarted'; return out; }
  return out;
}
const stepTimeMs = (p, sess, now = Date.now()) => (p.stepStartedAt && !p.finishedAt ? Math.max(0, sessionClock(sess, now) - p.stepStartedAt) : 0);

/* ---------- Lab Designer resource math (deterministic, never invented) ---------- */
const normName = (s) => String(s || '').toLowerCase().replace(/[^a-z0-9 ]/g, ' ').split(/\s+/).filter(Boolean).map((w) => w.replace(/(es|s)$/, '')).filter((w) => !['ml', 'l', 'g', 'the', 'a', 'of', 'per'].includes(w));
function matchInventory(mat, inventory) {
  if (!inventory.length) return null;
  if (mat.inventory) {
    const exact = inventory.find((i) => i.name.trim().toLowerCase() === String(mat.inventory).trim().toLowerCase());
    if (exact) return exact;
  }
  const mt = normName(mat.name);
  let best = null, bestScore = 0;
  for (const it of inventory) {
    const it_ = normName(it.name);
    if (!it_.length) continue;
    const shared = it_.filter((w) => mt.includes(w)).length;
    const score = shared / Math.max(1, Math.min(it_.length, mt.length));
    if (shared && score > bestScore) { best = it; bestScore = score; }
  }
  return bestScore >= 0.5 ? best : null;
}

/** Periods selected in the designer, with enrollment-based defaults and teacher overrides. */
function designerPeriods(d) {
  const out = [];
  for (const cls of myClasses()) for (const per of cls.periods) {
    const sel = d.logistics.sel[`${cls.id}:${per.id}`];
    if (!sel || !sel.on) continue;
    const enrolled = enrolledCount(cls.id, per.id);
    const students = sel.override !== '' && sel.override != null ? Math.max(0, parseInt(sel.override, 10) || 0) : enrolled;
    out.push({ key: `${cls.id}:${per.id}`, classId: cls.id, periodId: per.id, label: `${cls.name} · ${per.name}`, short: `${shortPeriod(per.name)}`, enrolled, students });
  }
  const size = Math.max(1, parseInt(d.logistics.groupSize, 10) || 1);
  out.forEach((p) => { p.groups = p.students ? Math.ceil(p.students / size) : 0; });
  return out;
}

function computeResources(plan, d) {
  const periods = designerPeriods(d);
  const reuse = !!d.logistics.reuseAcrossPeriods;
  const inventory = d.inventory.filter((i) => i.name.trim());
  const materials = (plan.materials || []).map((m) => {
    const per = m.per === 'student' ? 'student' : 'group';
    const q = Number(m.qtyPerGroup) || 0;
    const shared = Math.max(1, parseInt(m.sharedBy, 10) || 1);
    const perPeriod = periods.map((p) => {
      if (per === 'student') return q * p.students;
      if (m.kind === 'reusable') return Math.ceil(p.groups / shared) * q;
      return p.groups * q;
    });
    const peak = perPeriod.length ? Math.max(...perPeriod) : 0;
    const total = m.kind === 'reusable' ? (reuse ? peak : sum(perPeriod)) : sum(perPeriod);
    const inv = matchInventory(m, inventory);
    let status = 'ok', note = '';
    if (!inv) { status = 'unlisted'; note = 'Not in your inventory list'; }
    else if (inv.unit && m.unit && normName(inv.unit).join() !== normName(m.unit).join() && !(normName(m.name).some((w) => normName(inv.unit).includes(w)))) {
      status = 'units'; note = `Units differ (plan: ${m.unit}, inventory: ${inv.unit})`;
    } else if (m.kind === 'reusable' && peak > inv.qty) { status = 'bottleneck'; note = `Need ${fmtQty(peak)} at once, have ${fmtQty(inv.qty)}`; }
    else if (total > inv.qty) { status = 'short'; note = `Short by ${fmtQty(round(total - inv.qty))}`; }
    else if (m.kind === 'consumable' && total === inv.qty && total > 0) { status = 'tight'; note = 'Uses every one you have; no spares'; }
    return { ...m, per, shared, perPeriod, peak: round(peak), total: round(total), inv, status, note };
  });
  const stepsMin = sum((plan.steps || []).map((s) => s.minutes || 0));
  const setup = Number(d.logistics.setupMinutes) || 0, cleanup = Number(d.logistics.cleanupMinutes) || 0;
  const available = Number(d.logistics.labMinutes) || 0;
  const time = { setup, cleanup, steps: stepsMin, total: setup + stepsMin + cleanup, available };
  time.over = time.total - available;

  const issues = [];
  if (time.over > 0) issues.push({ sev: 'bad', text: `The plan runs ${time.over} min over your ${available}-minute lab time (${time.total} min including setup and cleanup).` });
  for (const m of materials) {
    if (m.status === 'bottleneck') {
      const worst = periods[m.perPeriod.indexOf(m.peak)];
      issues.push({ sev: 'bad', text: `${m.name}: ${worst ? worst.short + ' needs' : 'need'} ${fmtQty(m.peak)} at the same time, but you listed ${fmtQty(m.inv.qty)}. Groups would have to wait or share.` });
    } else if (m.status === 'short') issues.push({ sev: 'bad', text: `${m.name}: ${fmtQty(m.total)} ${m.unit} needed across the selected periods, ${fmtQty(m.inv.qty)} available.` });
    else if (m.status === 'unlisted') issues.push({ sev: 'warn', text: `${m.name} isn't in your inventory. Add it with the quantity you have, or remove it from the plan.` });
    else if (m.status === 'units') issues.push({ sev: 'warn', text: `${m.name}: ${m.note}. Check the totals by hand.` });
    else if (m.status === 'tight') issues.push({ sev: 'warn', text: `${m.name}: the plan uses all ${fmtQty(m.inv.qty)} you have, with nothing left for a repeat trial.` });
  }
  if (!periods.length) issues.push({ sev: 'warn', text: 'No class periods are selected, so group counts and totals are zero.' });
  return { periods, materials, time, issues, totalStudents: sum(periods.map((p) => p.students)), totalGroups: sum(periods.map((p) => p.groups)) };
}

/* ---------- Procedure checks (flag, never fill in) ---------- */
const VAGUE = /\b(appropriate amount|as needed|some|a few|a little|enough|etc\.?|approximately|until done|a bit)\b/i;
function procedureFlags(c) {
  const f = [];
  const add = (level, field, text) => f.push({ level, field, text });
  if (!c.title || !c.title.trim()) add('missing', 'title', 'The lab has no title.');
  if (!c.objectives.filter((o) => o.trim()).length) add('missing', 'objectives', 'No learning objectives were found.');
  if (!c.materials.length) add('missing', 'materials', 'No materials list was found.');
  c.materials.forEach((m, i) => {
    if (!m.name.trim()) add('missing', `materials.${i}`, `Material ${i + 1} has no name.`);
    else if (m.qtyPerGroup == null || m.qtyPerGroup === '') add('missing', `materials.${i}`, `“${m.name}” has no quantity.`);
    if (m.name.trim() && m.kind === 'unknown') add('unclear', `materials.${i}`, `Is “${m.name}” reusable equipment or a consumable?`);
  });
  if (!c.steps.length) add('missing', 'steps', 'No numbered procedure steps were found.');
  c.steps.forEach((s, i) => {
    const n = i + 1;
    if (!s.instructions.trim()) add('missing', `steps.${i}`, `Step ${n} has no instructions.`);
    if (!s.minutes) add('missing', `steps.${i}`, `Step ${n} has no time estimate. Live tracking needs one to spot groups that may be behind.`);
    const m = VAGUE.exec(s.instructions);
    if (m) add('unclear', `steps.${i}`, `Step ${n} says “${m[0]}”. Students may need an exact amount or condition.`);
  });
  if (!c.steps.some((s) => s.inputs.length)) add('unclear', 'steps', 'No step asks students to record a measurement or observation.');
  if (!c.precautions.filter((p) => p.trim()).length) add('missing', 'precautions', 'No precautions were found. Add any that apply to this lab.');
  if (!c.cleanup.filter((p) => p.trim()).length) add('missing', 'cleanup', 'No cleanup instructions were found.');
  return f;
}
/** Blocking problems before a version can be marked Ready to Assign. */
function readyErrors(c) {
  const e = [];
  if (!c.title.trim()) e.push('Add a title.');
  if (!c.steps.length) e.push('Add at least one procedure step.');
  c.steps.forEach((s, i) => {
    if (!s.title.trim() || !s.instructions.trim()) e.push(`Step ${i + 1} needs a title and instructions.`);
    if (!s.minutes || s.minutes <= 0) e.push(`Step ${i + 1} needs a time estimate in minutes.`);
  });
  c.materials.forEach((m, i) => { if (!m.name.trim()) e.push(`Material ${i + 1} needs a name.`); });
  e.push(...checkpointErrors(c));
  return e;
}
function blankContent() {
  return normalizeContent({ title: '', subject: '', level: LEVELS[2], objectives: [''], materials: [], setup: [''], steps: [blankStep()], cleanup: [''], precautions: [''], setupMinutes: 5, cleanupMinutes: 5, assumptions: [], questions: [] });
}
function blankStep() { return { id: uid(), title: '', instructions: '', minutes: null, materials: [], inputs: [], expected: '' }; }
function blankMaterial() { return { id: uid(), name: '', qtyPerGroup: 1, unit: '', kind: 'reusable', per: 'group', sharedBy: 1, inventory: null }; }

/* ---------- Join codes ---------- */
const CODE_ALPHABET = 'ACDEFGHJKMNPQRTUVWXY34679';
function newJoinCode() {
  const taken = new Set(S.classes.map((c) => c.joinCode));
  let code;
  do {
    const pick = () => CODE_ALPHABET[Math.floor(Math.random() * CODE_ALPHABET.length)];
    code = `${pick()}${pick()}${pick()}-${pick()}${pick()}${pick()}`;
  } while (taken.has(code));
  return code;
}

   v2 models: teacher-authored checkpoints, student profiles, workspaces.
   ===================================================================== */

/**
 * @typedef {{id:string,type:'short'|'long'|'mc'|'numeric',prompt:string,options:{id:string,text:string}[],
 *            correct:string|null,feedback:string,unit:string,required:boolean}} CheckpointQuestion
 *   `correct` and `feedback` are answer-key data: teacher-only unless the checkpoint's feedbackRelease allows it.
 * @typedef {{id:string,afterStepId:string,title:string,info:string,observe:string,image:null|{name:string,dataUrl:string},

}
/** Bring any procedure content up to the v2 shape. Old `step.checkpoint: true` becomes an approval checkpoint. */
function normalizeContent(c) {
  if (!c) return c;
  c.description = c.description || ''; c.background = c.background || '';
  c.prep = Array.isArray(c.prep) ? c.prep : []; c.studentNotes = c.studentNotes || ''; c.teacherNotes = c.teacherNotes || '';
  c.acknowledgment = c.acknowledgment || ''; c.attachments = Array.isArray(c.attachments) ? c.attachments : [];
  c.checkpoints = Array.isArray(c.checkpoints) ? c.checkpoints : [];
  c.objectives = c.objectives || []; c.materials = c.materials || []; c.setup = c.setup || []; c.cleanup = c.cleanup || []; c.precautions = c.precautions || [];
  c.steps = (c.steps || []).map((s) => {
    if (!s.id) s.id = uid();
    s.materials = s.materials || []; s.inputs = s.inputs || []; s.expected = s.expected || '';
    if (s.checkpoint === true && !c.checkpoints.some((cp) => cp.afterStepId === s.id)) {
      c.checkpoints.push({ ...blankCheckpoint(s.id), title: `Teacher check: ${s.title}`, info: 'Ask your teacher to check your setup before you continue.', kind: 'info', responseRequired: false, approvalRequired: true, questions: [] });
    }
    delete s.checkpoint;
    return s;
  });
  c.checkpoints.forEach((cp) => { cp.questions = cp.questions || []; cp.questions.forEach((q) => { q.options = q.options || []; }); });
  return c;
}
const checkpointAfter = (c, stepId) => (c.checkpoints || []).find((cp) => cp.afterStepId === stepId) || null;
const checkpointById = (c, id) => (c.checkpoints || []).find((cp) => cp.id === id) || null;
const stepIndexById = (c, id) => c.steps.findIndex((s) => s.id === id);
/** Does this checkpoint hold students until something happens? */
const cpBlocks = (cp) => !!(cp.approvalRequired || (cp.kind === 'response' && (cp.responseRequired || cp.requireCorrect)));
function cpRuleText(cp) {
  const parts = [];
  if (cp.kind === 'info') parts.push('Informational');
  else parts.push(cp.responseRequired ? 'Response required to continue' : 'Response optional');
  if (cp.requireCorrect) parts.push('must answer multiple choice correctly');
  if (cp.approvalRequired) parts.push('teacher approval required');
  parts.push(cp.scope === 'group' ? 'one response per group' : 'each student responds');
  return parts.join(' · ');
}
function checkpointErrors(c) {
  const e = [];
  c.checkpoints.forEach((cp) => {
    const i = stepIndexById(c, cp.afterStepId);
    const where = i === -1 ? 'A checkpoint' : `The checkpoint after step ${i + 1}`;
    if (i === -1) e.push('A checkpoint is attached to a step that no longer exists. Move or delete it.');
    if (!cp.title.trim()) e.push(`${where} needs a title.`);
    if (cp.kind === 'response' && !cp.questions.length) e.push(`${where} asks for a response but has no questions.`);
    cp.questions.forEach((q, j) => {
      if (!q.prompt.trim()) e.push(`${where}: question ${j + 1} needs a prompt.`);
      if (q.type === 'mc' && q.options.filter((o) => o.text.trim()).length < 2) e.push(`${where}: question ${j + 1} needs at least two choices.`);
    });
    if (cp.requireCorrect && !cp.questions.some((q) => q.type === 'mc' && q.correct)) e.push(`${where} requires correct answers but no multiple-choice question has a correct answer set.`);
  });
  return e;
}
/** Is a submitted multiple-choice answer correct? Only questions with a key count. */
function mcResults(cp, responses) {
  return cp.questions.filter((q) => q.type === 'mc' && q.correct).map((q) => ({ qid: q.id, correct: responses[q.id] === q.correct }));
}
const allCorrect = (cp, responses) => mcResults(cp, responses).every((r) => r.correct);
function missingAnswers(cp, responses) {
  return cp.questions.filter((q) => q.required && !String(responses[q.id] ?? '').trim()).map((q) => q.id);
}

/* =====================================================================
   Student Visibility & Release + the student data-access layer.

   studentLabView() is the ONLY way student screens read lab content.
   It returns a projection that contains just what the release rules
   allow right now. Teacher-only notes, answer keys and unreleased
   questions are never copied into it. In production this function runs
   on the server and the browser only ever receives its output.
   ===================================================================== */
const RELEASE_SECTIONS = [
  ['objectives', 'Learning objectives'], ['background', 'Background information'], ['materials', 'Materials and equipment'],
  ['prep', 'Preparation tasks'], ['precautions', 'Precautions'], ['studentNotes', 'Notes for students'],
  ['attachments', 'Attachments'], ['procedure', 'Procedure steps'],
];
const RELEASE_PRESETS = {
  recommended: { label: 'Recommended', hint: 'Prep in advance, procedure when the session opens', rules: { objectives: 'before', background: 'before', materials: 'before', prep: 'before', precautions: 'before', studentNotes: 'before', attachments: 'during', procedure: 'during' } },
  advance: { label: 'Everything in advance', hint: 'Students can read the whole lab before class', rules: { objectives: 'before', background: 'before', materials: 'before', prep: 'before', precautions: 'before', studentNotes: 'before', attachments: 'before', procedure: 'before' } },
  live: { label: 'Only during the session', hint: 'Students see only the title and date beforehand', rules: { objectives: 'during', background: 'during', materials: 'during', prep: 'during', precautions: 'during', studentNotes: 'during', attachments: 'during', procedure: 'during' } },
};
const RELEASE_DEFAULTS = { ...RELEASE_PRESETS.recommended.rules, revisit: true };
const releaseOf = (lab) => ({ ...RELEASE_DEFAULTS, ...((lab && lab.release) || {}) });

function stageOptions(c, key) {
  const base = [['before', 'Before the live session'], ['during', 'When the live session opens']];
  if (key === 'procedure') return base; // the live session needs the procedure, so it can't come later
  return [...base, ...c.steps.map((s, i) => [`step:${s.id}`, `After step ${i + 1} is completed${s.title ? ` (${s.title})` : ''}`]), ['after', 'After the session is complete'], ['hidden', 'Not shown to students']];
}
function releaseWhenText(rule, c) {
  if (rule === 'before') return 'available now';
  if (rule === 'during') return 'when the live session opens';
  if (rule === 'after') return 'after the session is complete';
  if (rule === 'hidden') return 'not shown to students';
  if (String(rule).startsWith('step:')) { const i = stepIndexById(c, rule.slice(5)); return i === -1 ? 'when the live session opens' : `after step ${i + 1} is completed`; }
  return '';
}
/** ctx: {status:'scheduled'|'active'|'paused'|'completed', open:boolean, done:Set<stepId>} */
function isReleased(rule, c, ctx) {
  if (rule === 'before') return true;
  if (rule === 'during') return ctx.open || ['active', 'paused', 'completed'].includes(ctx.status);
  if (rule === 'after') return ctx.status === 'completed';
  if (rule === 'hidden') return false;
  if (String(rule).startsWith('step:')) {
    const id = rule.slice(5);
    if (stepIndexById(c, id) === -1) return ctx.open || ['active', 'paused', 'completed'].includes(ctx.status);
    return ctx.done.has(id) || ctx.status === 'completed';
  }
  return false;
}

/* ---------- Student enrollment helpers ---------- */
const studentEnrollments = (userId) => S.enrollments.filter((e) => e.studentId === userId && classById(e.classId));
const studentGroup = (classId, periodId, userId) => groupsIn(classId, periodId).find((g) => g.memberIds.includes(userId)) || null;
const sessionForPeriod = (a, periodId) => S.sessions.find((s) => s.assignmentId === a.id && s.periodId === periodId) || null;
function scheduledAt(a) {
  const t = a.scheduledTime || '08:00';
  return new Date(`${a.scheduledFor}T${t}`).getTime();
}
const fmtSchedule = (a) => `${a.scheduledFor === todayISO() ? 'Today' : fmtDateLong(scheduledAt(a))}${a.scheduledTime ? ', ' + fmtClock(scheduledAt(a)) : ''}`;
/** Is the session open to students? A scheduled time alone never opens it unless the teacher turned on autoOpen. */
function sessionOpen(sess, a, now = Date.now()) {
  if (!sess) return false;
  if (sess.status === 'active' || sess.status === 'paused') return true;
  return sess.status === 'scheduled' && !!a.autoOpen && scheduledAt(a) <= now;
}
/** Published assignments for a student, newest first. Unpublished labs are never listed. */
function studentAssignments(userId) {
  const out = [];
  for (const e of studentEnrollments(userId)) {
    for (const a of S.assignments) {
      if (a.classId !== e.classId || !a.periodIds.includes(e.periodId) || a.published === false) continue;
      const lab = labById(a.labId); if (!lab) continue;
      out.push({ a, e, sess: sessionForPeriod(a, e.periodId) });
    }
  }
  return out.sort((x, y) => scheduledAt(y.a) - scheduledAt(x.a));
}
const STUDENT_LAB_STATUS = {
  upcoming: { label: 'Upcoming', icon: 'calendar', tone: 'idle' },
  prepare: { label: 'Available to Prepare', icon: 'book', tone: 'accent' },
  ready: { label: 'Ready to Start', icon: 'play', tone: 'ok' },
  inprogress: { label: 'In Progress', icon: 'playCircle', tone: 'blue' },
  completed: { label: 'Completed', icon: 'checkCircle', tone: 'idle' },
};
function studentLabStatus(a, sess, p, c, rel) {
  if (!sess) return 'upcoming';
  if (sess.status === 'completed' || (p && p.finishedAt)) return 'completed';
  if (sessionOpen(sess, a)) return p && (p.completed.length || (p.joined || []).length) ? 'inprogress' : 'ready';
  const prepReleased = ['objectives', 'background', 'materials', 'prep', 'precautions', 'studentNotes', 'attachments', 'procedure'].some((k) => rel[k] === 'before' && sectionHasContent(c, k));
  return prepReleased ? 'prepare' : 'upcoming';
}
function sectionHasContent(c, k) {
  if (k === 'procedure') return c.steps.length > 0;
  if (k === 'background' || k === 'studentNotes') return !!String(c[k] || '').trim();
  return (c[k] || []).filter((x) => (typeof x === 'string' ? x.trim() : true)).length > 0;
}

/**
 * Build the student projection of an assigned lab.
 * @param preview  teacher "Preview as Student": {status, done:Set<stepId>} replaces live session data.
 */
function studentLabView(a, userId, preview = null) {
  const lab = labById(a.labId); if (!lab) return null;
  const v = versionById(lab, a.versionId); if (!v) return null;
  const c = v.content; const rel = releaseOf(lab);
  const cls = classById(a.classId);
  const enr = preview ? null : S.enrollments.find((e) => e.studentId === userId && e.classId === a.classId && a.periodIds.includes(e.periodId));
  if (!preview && (!enr || a.published === false)) return null; // not enrolled in an assigned period, or not published
  const periodId = preview ? (preview.periodId || a.periodIds[0]) : enr.periodId;
  const sess = preview ? null : sessionForPeriod(a, periodId);
  const group = preview ? null : studentGroup(a.classId, periodId, userId);
  const p = sess && group ? S.progress.find((x) => x.sessionId === sess.id && x.groupId === group.id) : null;
  const ctx = preview
    ? { status: preview.status, open: preview.status !== 'scheduled', done: preview.done || new Set() }
    : { status: sess ? sess.status : 'scheduled', open: sessionOpen(sess, a), done: new Set(p ? p.completed.map((x) => x.stepId) : []) };
  const status = preview ? ({ scheduled: 'prepare', active: 'inprogress', completed: 'completed' }[preview.status] || 'prepare') : studentLabStatus(a, sess, p, c, rel);
  const afterRevisitBlocked = ctx.status === 'completed' && !rel.revisit;
  const view = {
    assignmentId: a.id, labId: lab.id, versionId: v.id, versionNumber: v.number, classId: a.classId, className: cls ? cls.name : '',
    periodId, periodName: periodName(a.classId, periodId), teacherName: (S.users.find((u) => cls && u.id === cls.teacherId) || {}).name || '',
    sessionId: sess ? sess.id : null, sessionStatus: ctx.status, sessionOpen: ctx.open,
    title: c.title, description: c.description || '', subject: c.subject,
    scheduledFor: a.scheduledFor, scheduledTime: a.scheduledTime || '', autoOpen: !!a.autoOpen,
    durationMin: plannedMinutes(c), status, acknowledgment: c.acknowledgment || '', revisit: !!rel.revisit,
    group: group ? { id: group.id, name: group.name, members: memberNames(group) } : null,
    stepCount: c.steps.length, sections: {}, locked: [], procedure: null,
  };
  const released = (k) => !afterRevisitBlocked && isReleased(rel[k], c, ctx);
  const lock = (k, label) => { if (rel[k] !== 'hidden' && sectionHasContent(c, k)) view.locked.push({ key: k, label, when: afterRevisitBlocked ? 'closed after the session' : releaseWhenText(rel[k], c) }); };
  for (const [k, label] of RELEASE_SECTIONS) {
    if (k === 'procedure') continue;
    if (!sectionHasContent(c, k)) continue;
    if (!released(k)) { lock(k, label); continue; }
    if (k === 'materials') view.sections.materials = c.materials.filter((m) => m.name.trim()).map((m) => ({ name: m.name, qty: m.qtyPerGroup, unit: m.unit, per: m.per, sharedBy: m.sharedBy }));
    else if (k === 'attachments') view.sections.attachments = c.attachments.map((f) => ({ id: f.id, name: f.name, type: f.type, size: f.size, key: f.key }));
    else if (k === 'background' || k === 'studentNotes') view.sections[k] = c[k];
    else view.sections[k] = c[k].filter((x) => String(x).trim());
  }
  if (released('procedure')) {
    view.procedure = {
      setupMinutes: c.setupMinutes || 0,
      steps: c.steps.map((s) => ({ id: s.id, title: s.title, instructions: s.instructions, minutes: s.minutes, materials: [...s.materials], inputs: s.inputs.map((x) => ({ ...x })) })),
      cleanup: c.cleanup.filter((x) => x.trim()),
      // A checkpoint is released only once its step is completed by this student's group.
      checkpoints: c.checkpoints.filter((cp) => ctx.done.has(cp.afterStepId))
        .map((cp) => projectCheckpoint(cp, preview ? { preview: true, sessionStatus: ctx.status } : { trackKey: sess ? sess.id : null, groupId: group ? group.id : null, userId, sessionStatus: ctx.status })),
    };
  } else lock('procedure', 'Procedure steps');
  return view;
}

/** Student-visible copy of a checkpoint. Answer keys stay out; feedback is computed here when allowed. */
function projectCheckpoint(cp, { trackKey = null, groupId = null, userId = null, sessionStatus = 'active', preview = false } = {}) {
  const out = {
    id: cp.id, afterStepId: cp.afterStepId, title: cp.title, info: cp.info, observe: cp.observe, image: cp.image ? { name: cp.image.name, dataUrl: cp.image.dataUrl } : null,
    kind: cp.kind, responseRequired: cp.responseRequired, approvalRequired: cp.approvalRequired, scope: cp.scope, requireCorrect: cp.requireCorrect,
    questions: cp.questions.map((q) => ({ id: q.id, type: q.type, prompt: q.prompt, options: q.options.filter((o) => o.text.trim()).map((o) => ({ id: o.id, text: o.text })), unit: q.unit, required: q.required })),
    rule: cpRuleText(cp), results: null, incorrect: [],
  };
  if (preview || !trackKey) return out;
  const rec = cpRecordFor(trackKey, groupId, cp, userId);
  if (rec && rec.submittedAt) {
    const res = mcResults(cp, rec.responses);
    if (cp.requireCorrect) out.incorrect = res.filter((r) => !r.correct).map((r) => r.qid); // which ones to revise, never the right choice
    const canShow = cp.feedbackRelease === 'onSubmit' || (cp.feedbackRelease === 'afterSession' && sessionStatus === 'completed');
    if (canShow) out.results = res.map((r) => { const q = cp.questions.find((x) => x.id === r.qid); return { qid: r.qid, correct: r.correct, feedback: q.feedback || '' }; });
  }
  return out;
}

/* ---------- Deterministic pseudo-random for stable demo data ---------- */
function seededRandom(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
function fakeReading(label, unit, rnd = Math.random) {
  const l = (label + ' ' + unit).toLowerCase();
  const r = (a, b, d = 1) => (a + rnd() * (b - a)).toFixed(d);
  if (/mass of metal/.test(l)) return r(25, 35, 2);
  if (/mass of water/.test(l)) return r(99.6, 100.4, 1);
  if (/bath/.test(l)) return r(97.8, 99.6, 1);
  if (/initial water/.test(l)) return r(20.5, 22.8, 1);
  if (/final water/.test(l)) return r(24.2, 28.9, 1);
  if (/specific heat/.test(l)) return ['0.385', '0.449', '0.897', '0.129', '0.235'][Math.floor(rnd() * 5)];
  if (/identified metal/.test(l)) return ['Copper', 'Iron', 'Aluminum', 'Lead', 'Tin'][Math.floor(rnd() * 5)];
  if (/foam/.test(l)) return r(4, 38, 0);
  if (/titre|reading/.test(l)) return r(8.2, 9.4, 2);
  if (/acetic/.test(l)) return r(4.7, 5.3, 2);
  if (/°c/.test(l)) return r(4, 60, 1);
  if (/time/.test(l) && /\bs\b/.test(l)) return r(18, 95, 0);
  if (!unit) return ['Recorded in notebook', 'Matches prediction', 'See sketch'][Math.floor(rnd() * 3)];
  return r(1, 50, 1);
}

const PDFJS_SRC = [
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
];
const Formats = { pdf: 'unknown', docx: typeof DecompressionStream === 'function' ? 'ok' : 'unavailable', txt: 'ok' };
class ImportError extends Error { constructor(message, hint) { super(message); this.hint = hint; } }

function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src; s.async = true;
    s.onload = () => resolve(); s.onerror = () => reject(new Error(`Could not load ${src}`));
    document.head.appendChild(s);
  });
}
let pdfLoading = null;
function loadPdfJs() {
  if (window.pdfjsLib && window.pdfjsWorker) return Promise.resolve(window.pdfjsLib);
  if (!pdfLoading) {
    // Loading the worker script first lets pdf.js parse on the page itself (no separate worker needed).
    pdfLoading = (async () => {
      for (const src of PDFJS_SRC) await loadScript(src);
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_SRC[0];
      Formats.pdf = 'ok';
      return window.pdfjsLib;
    })().catch((e) => { pdfLoading = null; Formats.pdf = 'unavailable'; throw e; });
  }
  return pdfLoading;
}

async function readPdf(file) {
  let lib;
  try { lib = await loadPdfJs(); } catch (e) {
    throw new ImportError('The PDF reader couldn’t load right now, so this PDF can’t be read.', 'Paste the procedure text instead, or try again later.');
  }
  const data = new Uint8Array(await file.arrayBuffer());
  let doc;
  try { doc = await lib.getDocument({ data, isEvalSupported: false }).promise; } catch (e) {
    if (e && e.name === 'PasswordException') throw new ImportError('This PDF is password-protected.', 'Remove the password and upload it again, or paste the text.');
    throw new ImportError('This file couldn’t be opened as a PDF. It may be damaged.', 'Try exporting the PDF again, or paste the text.');
  }
  const pages = [];
  for (let i = 1; i <= Math.min(doc.numPages, 30); i++) {
    const page = await doc.getPage(i);
    const tc = await page.getTextContent();
    let out = '', lastY = null;

async function unzipEntry(buf, wanted) {
  const dv = new DataView(buf);
  let eocd = -1;
  for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 70000); i--) { if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; } }
  if (eocd < 0) throw new ImportError('This file isn’t a valid .docx document.', 'Open it in Word or Google Docs and save it as .docx again.');
  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const dec = new TextDecoder();
  for (let n = 0; n < count; n++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true), compSize = dv.getUint32(p + 20, true);
    const nameLen = dv.getUint16(p + 28, true), extraLen = dv.getUint16(p + 30, true), commentLen = dv.getUint16(p + 32, true);
    const localOff = dv.getUint32(p + 42, true);
    const name = dec.decode(new Uint8Array(buf, p + 46, nameLen));
    if (name === wanted) {
      const start = localOff + 30 + dv.getUint16(localOff + 26, true) + dv.getUint16(localOff + 28, true);
      const bytes = new Uint8Array(buf, start, compSize);
      if (method === 0) return dec.decode(bytes);
      if (method === 8) return await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
      throw new ImportError('This .docx uses a compression method Labby can’t read.', 'Save it again from Word or Google Docs, or paste the text.');
    }
    p += 46 + nameLen + extraLen + commentLen;
  }
  throw new ImportError('This .docx has no document body.', 'Save it again from Word or Google Docs, or paste the text.');
}
async function readDocx(file) {
  if (Formats.docx !== 'ok') throw new ImportError('This browser can’t unpack .docx files.', 'Paste the text instead, or use a recent version of Chrome, Edge, Firefox or Safari.');
  const xml = await unzipEntry(await file.arrayBuffer(), 'word/document.xml');
  const doc = new DOMParser().parseFromString(xml, 'application/xml');
  const W = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';
  const lines = [];
  for (const para of Array.from(doc.getElementsByTagNameNS(W, 'p'))) {
    let t = '';
    const walk = (node) => {
      for (const ch of Array.from(node.childNodes)) {
        if (ch.namespaceURI === W && ch.localName === 't') t += ch.textContent;
        else if (ch.namespaceURI === W && ch.localName === 'tab') t += ' ';
        else if (ch.namespaceURI === W && (ch.localName === 'br' || ch.localName === 'cr')) t += '\n';
        else if (ch.nodeType === 1 && ch.localName !== 'pPr') walk(ch);
      }
    };
    walk(para);
    const isList = para.getElementsByTagNameNS(W, 'numPr').length > 0;
    if (t.trim()) lines.push((isList ? '- ' : '') + t.trim());
    else lines.push('');
  }
  const text = lines.join('\n').replace(/\n{3,}/g, '\n\n').trim();
  if (!text) throw new ImportError('This .docx has no text in it.', 'Check that you picked the right file.');
  return { text };
}

async function readProcedureFile(file) {
  const name = file.name.toLowerCase();
  if (file.size > 15 * 1024 * 1024) throw new ImportError('This file is larger than 15 MB.', 'Upload a smaller file or paste the procedure text.');
  if (name.endsWith('.pdf') || file.type === 'application/pdf') return { kind: 'pdf', ...(await readPdf(file)) };
  if (name.endsWith('.docx')) return { kind: 'docx', ...(await readDocx(file)) };
  if (name.endsWith('.txt') || name.endsWith('.md') || file.type === 'text/plain') {
    const text = (await file.text()).trim();
    if (!text) throw new ImportError('This text file is empty.', 'Check that you picked the right file.');
    return { kind: 'txt', text };
  }
  if (name.endsWith('.doc')) throw new ImportError('Older Word files (.doc) can’t be read.', 'In Word, choose File → Save As → .docx, or paste the text.');
  if (/\.(png|jpe?g|heic|gif|webp)$/.test(name)) throw new ImportError('Photos of procedures can’t be read yet.', 'Paste the text or type it into the manual editor.');
  if (/\.(pages|odt|rtf)$/.test(name)) throw new ImportError('This document format isn’t supported.', 'Export it as PDF or .docx, or paste the text.');
  throw new ImportError('Labby can read PDF, DOCX and plain-text files.', 'Pick a different file or paste the text.');
}

   2. Procedure text → structured, editable procedure
      Rule-based: it only uses what the text says. Anything missing

const SECTION_RX = [
  ['objectives', /^(learning\s+)?(objectives?|purpose|aims?|goals?)$/i],
  ['materials', /^(materials?|equipment|supplies|apparatus)(\s+(and|&)\s+(equipment|materials|supplies))?( list)?$/i],
  ['setup', /^(set\s?-?up|preparation|teacher prep(aration)?|pre-?lab set\s?-?up|before you begin)$/i],
  ['steps', /^(procedures?|method|methods|steps|instructions|directions)(\s*\(.*\))?$/i],
  ['data', /^(data( table| collection| to record)?|observations?|measurements?|results)$/i],
  ['precautions', /^(safety( notes| precautions| rules)?|precautions?|hazards?|warnings?)$/i],
  ['cleanup', /^(clean\s?-?up|disposal|cleaning up)$/i],
  ['ignore', /^(analysis( questions)?|questions|conclusions?|discussion|post-?lab( questions)?|extensions?|background|introduction|pre-?lab questions|calculations?)$/i],
];
const REUSABLE_RX = /beaker|cylinder|thermometer|balance|scale\b|hot ?plate|burner|goggle|stopwatch|timer|tongs|ruler|pencil|clip|rack|flask|burette|buret|pipette|funnel|tube|probe|stand|clamp|tray|spatula|magnifier|microscope|calorimeter|marker|dish|cup|stopper|bolt|marble|lab coat|apron/i;
const CONSUMABLE_RX = /water|solution|tablet|paper|towel|\bice\b|acid|hcl|naoh|peroxide|salt|sugar|vinegar|indicator|potato|splint|tape|foil|filter|baking soda|coloring|reagent|cube|alcohol|glue|string/i;
const PER_STUDENT_RX = /goggle|glove|apron|lab coat/i;

function headerOf(line) {
  const t = line.replace(/^\s*((part\s+)?[ivx]+\.|[a-h]\.|\d+\.)\s+/i, '').replace(/[:.]\s*$/, '').trim();
  if (t.length > 40) return null;
  for (const [key, rx] of SECTION_RX) if (rx.test(t)) return { key, label: t };
  return null;
}
const BULLET_RX = /^\s*(?:[-•*–·▪◦]|\(?[a-z]\))\s+/;
const NUM_RX = /^\s*(?:step\s*)?(\d{1,2})\s*[.):]\s+/i;
function splitItems(lines) {
  const hasMarkers = lines.some((l) => BULLET_RX.test(l) || NUM_RX.test(l));
  const items = [];
  for (const raw of lines) {
    const line = raw.trim();
    if (!line) continue;
    if (BULLET_RX.test(line) || NUM_RX.test(line)) items.push(line.replace(BULLET_RX, '').replace(NUM_RX, '').trim());
    else if (hasMarkers && items.length) items[items.length - 1] += ' ' + line;
    else items.push(line);
  }
  return items;
}
function stepTitleFrom(text) {
  let first = text.split(/(?<=[.!?])\s/)[0].replace(/[.!?]$/, '');
  if (first.length > 46) {
    const cut = first.slice(0, 46).search(/\s(and|on|so|to|using|with|in|into|from|until|by|then|,)\s|,\s/);
    first = cut > 12 ? first.slice(0, cut) : first.split(/\s+/).slice(0, 6).join(' ');
  }
  first = first.replace(/[,;:]$/, '').trim();
  return first.charAt(0).toUpperCase() + first.slice(1);
}
const UNIT_WORDS = { grams: 'g', gram: 'g', g: 'g', cm: 'cm', mm: 'mm', ml: 'mL', milliliters: 'mL', seconds: 's', s: 's', minutes: 'min', '°c': '°C', degrees: '°C', celsius: '°C' };
function guessInputs(text) {
  const out = [];
  const unitM = /\bin\s+(grams|gram|g|cm|mm|ml|milliliters|seconds|°c|degrees(?: celsius)?)\b/i.exec(text);
  const unit = unitM ? (UNIT_WORDS[unitM[1].toLowerCase().split(' ')[0]] || unitM[1]) : '';
  if (/\brecord(s|ed)?\s+(it|them|this|these)\b/i.test(text)) {
    const obj = /\b(?:measure|calculate|find|determine|note)\s+(?:the\s+|your\s+)?([a-z][\w\s-]{2,40}?)(?=\s+(?:of|for|by|on|in|from|using|and)\b|[.,;]|$)/i.exec(text);
    if (obj) out.push({ label: cap(obj[1]), unit });
  } else {
    const m = /\brecord\s+(?:the\s+|your\s+|both\s+|each\s+|all\s+)?([a-z][\w\s-]{2,40}?)(?=\s+(?:in|to|on|for|and|before|after|of)\b|[.,;]|$)/i.exec(text);
    if (m) out.push({ label: cap(m[1]), unit });

const cap = (s) => { s = s.trim(); return s.charAt(0).toUpperCase() + s.slice(1); };
function parseMaterial(line) {
  let name = line.trim(), qty = null, unit = '', note = '';
  const paren = /^(.+?)\s*\(([^)]*)\)\s*$/.exec(name);
  if (paren && /\d/.test(paren[2])) {
    if (/per (class|room|lab)|class set|shared|for the class/i.test(paren[2])) { name = paren[1]; note = paren[2]; }
    else { const pm = /^(\d+(?:\.\d+)?)\s*([a-zA-Z]*)/.exec(paren[2].trim()); if (pm) { name = paren[1]; qty = +pm[1]; unit = pm[2] || ''; } }
  }
  if (qty == null && !note) {
    const lead = /^(\d+(?:\.\d+)?)\s*(?:x\s+)?(mL|L|g|kg|cm|mm|pcs?|pairs?|sets?|strips?|drops?|sheets?)?\s+(?:of\s+)?(.+)$/i.exec(name);
    if (lead) { qty = +lead[1]; unit = lead[2] || ''; name = lead[3]; }
    const trail = /^(.+?)\s*[x×]\s*(\d+)$/i.exec(name);
    if (qty == null && trail) { name = trail[1]; qty = +trail[2]; }

  if (REUSABLE_RX.test(name)) kind = 'reusable'; else if (CONSUMABLE_RX.test(name)) kind = 'consumable';
  if (!unit && qty != null) unit = kind === 'consumable' ? '' : 'each';

}
function parseProcedureText(text) {
  const lines = String(text).replace(/\r/g, '').split('\n');
  const sections = {}; const ignored = [];
  let current = 'preamble'; const pre = [];
  for (const line of lines) {
    const h = line.trim() ? headerOf(line.trim()) : null;
    if (h) { current = h.key; if (h.key === 'ignore') ignored.push(h.label); sections[current] = sections[current] || []; continue; }
    if (current === 'preamble') pre.push(line); else sections[current].push(line);
  }
  const preLines = pre.map((l) => l.trim()).filter(Boolean);
  const c = blankContent();
  c.title = preLines[0] || '';
  c.level = ''; c.setupMinutes = 0; c.cleanupMinutes = 0;
  c.objectives = sections.objectives ? splitItems(sections.objectives) : [];
  c.materials = sections.materials ? splitItems(sections.materials).map(parseMaterial) : [];
  c.setup = sections.setup ? splitItems(sections.setup) : [];
  c.precautions = sections.precautions ? splitItems(sections.precautions) : [];
  c.cleanup = sections.cleanup ? splitItems(sections.cleanup) : [];
  let detected = false;
  c.steps = (sections.steps ? splitItems(sections.steps) : []).map((t) => {
    let minutes = null;
    const dm = /\(\s*(?:about\s+|~|approx\.?\s*)?(\d+(?:\.\d+)?)\s*(?:[-–]|to)?\s*(\d+)?\s*min(?:ute)?s?\s*\)|\btime:\s*(\d+)\s*min/i.exec(t);
    if (dm) { minutes = +(dm[2] || dm[1] || dm[3]); t = t.replace(dm[0], '').replace(/\s{2,}/g, ' ').trim(); }
    const inputs = guessInputs(t); if (inputs.length) detected = true;
    return { id: uid(), title: stepTitleFrom(t), instructions: t, minutes, materials: [], inputs, checkpoint: /\bteacher\b[^.]*\b(check|initial|approve|sign|inspect)|\b(check|initial|approve|sign)\b[^.]*\bteacher\b/i.test(t) };
  });
  // Attach items from a Data section to the steps that mention them
  const unassigned = [];
  if (sections.data) {
    let pointer = 0;
    for (const item of splitItems(sections.data)) {
      const um = /^(.+?)\s*\(([^)]+)\)\s*$/.exec(item);
      const label = um ? um[1].trim() : item.trim(); const unit = um ? um[2].trim() : '';
      const words = normName(label);
      const scoreOf = (s) => normName(s.instructions).filter((w) => words.includes(w)).length;
      let idx = c.steps.findIndex((s, i) => i >= pointer && /record|measure/i.test(s.instructions) && scoreOf(s) > 0);
      if (idx === -1) idx = c.steps.findIndex((s) => scoreOf(s) > 0);
      if (idx === -1) { unassigned.push(label); continue; }
      const st = c.steps[idx];
      st.inputs = st.inputs.filter((x) => !normName(x.label).some((w) => words.includes(w)));
      st.inputs.push({ label, unit });
      pointer = idx + 1; detected = true;
    }
  }
  const notes = [];
  if (detected) notes.push({ level: 'unclear', field: 'steps', text: 'Student inputs were picked up from words like “record” and the Data section. Check each one.' });
  unassigned.forEach((l) => notes.push({ level: 'unclear', field: 'steps', text: `“${l}” is listed under Data but no step mentions it. Add it to the right step.` }));
  ignored.forEach((l) => notes.push({ level: 'info', field: '', text: `The “${l}” section wasn’t imported. It stays in the original file.` }));
  sections.materials && splitItems(sections.materials).forEach((l) => { if (/per (class|room|lab)|class set|shared/i.test(l)) notes.push({ level: 'unclear', field: 'materials', text: `“${l}” gives a class-wide amount, not a per-group quantity.` }); });
  normalizeContent(c);
  return { content: c, notes };
}

  if (status === 'helping') { h.status = 'helping'; h.helpingAt = now; h.log.push({ at: now, text: 'Teacher started helping' }); }
  if (status === 'resolved') { h.status = 'resolved'; h.resolvedAt = now; h.log.push({ at: now, text: 'Marked resolved' }); }

/** Save a version of a lab. Locked (assigned) versions are never edited; edits become a new version. */
function saveLabVersion(lab, content, state) {
  const now = Date.now();
  const latest = latestVersion(lab);
  content = normalizeContent(clone(content));
  if (latest.locked) lab.versions.push({ id: uid(), number: latest.number + 1, state, content: clone(content), createdAt: now, approvedAt: state === 'ready' ? now : undefined, locked: false });
  else { latest.content = clone(content); latest.state = state; latest.approvedAt = state === 'ready' ? now : undefined; }
  lab.updatedAt = now;
  return latestVersion(lab);
}
function newLab(content, source, original) {
  const now = Date.now();
  const lab = { id: uid(), teacherId: S.currentUserId, source, archived: false, createdAt: now, updatedAt: now, versions: [{ id: uid(), number: 1, state: 'draft', content: clone(content), createdAt: now, locked: false }] };
  if (original) lab.original = original;

}
