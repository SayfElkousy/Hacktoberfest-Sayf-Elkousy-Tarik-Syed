  const lab = labById(id);
  if (!lab || lab.teacherId !== S.currentUserId) return html`<div class="card">${emptyState({ ico: 'lock', title: 'Lab not found', text: 'This lab doesn’t exist or belongs to another teacher.', actions: html`<a class="btn" href="#library">Back to library</a>` })}</div>`;
  const latest = latestVersion(lab);
  if (!S.ui.editorDraft || S.ui.editorDraft.labId !== id) S.ui.editorDraft = { labId: id, content: clone(latest.content), readyErrors: [] };
  const ed = S.ui.editorDraft; const c = ed.content;
  const dirty = JSON.stringify(c) !== JSON.stringify(latest.content);
  const assigned = assignmentsForLab(lab.id);
  const flags = procedureFlags(c);
  return html`<div class="stack loose">
    <div class="row between wrap top"><div class="stack tight"><a href="#library" class="small">${icon('arrowLeft', 'sm')} Library</a>
      <div class="row wrap">${labPill(labStatus(lab))}<span class="tag">Editing version ${latest.locked ? latest.number + 1 : latest.number}${latest.locked ? ' (new)' : ''}</span><span class="tag">${SOURCE_LABEL[lab.source]}</span>${dirty ? html`<span class="tag" style="background:var(--warn-soft);color:var(--warn)">Unsaved changes</span>` : ''}</div></div>
      <div class="row wrap"><button class="btn btn-sm" data-action="preview-student" data-lid="${lab.id}">${icon('eye', 'sm')}Preview as Student</button>
        ${latestReady(lab) && !lab.archived ? html`<button class="btn btn-sm" data-action="assign-open" data-lid="${lab.id}">${icon('send', 'sm')}Assign</button>` : ''}</div></div>
    ${assigned.length ? html`<div class="notice">${icon('lock')}<div>${assigned.map((a) => html`<div><strong>Version ${versionById(lab, a.versionId).number}</strong> is assigned to ${classById(a.classId).name} · ${a.periodIds.map((p) => shortPeriod(periodName(a.classId, p))).join(', ')}.</div>`)}
      <div class="small" style="margin-top:4px">${latest.locked ? `Saving creates version ${latest.number + 1}. Students in those sessions keep the version they were given.` : `You’re editing version ${latest.number}, which isn’t assigned. Sessions already assigned won’t change.`}</div></div></div>` : ''}
    ${ed.readyErrors.length ? html`<div class="error-summary" role="alert" id="ed-errors"><strong>Fix these before marking it Ready to Assign:</strong><ul>${ed.readyErrors.map((e) => html`<li>${e}</li>`)}</ul></div>` : ''}
    <div class="import-grid" style="grid-template-columns:minmax(0,1.5fr) minmax(280px,0.75fr)">
      <div class="stack" style="min-width:0">
        ${procedureEditor('ui.editorDraft.content', c, { errors: ed.readyErrors, mode: 'class' })}
        <div class="sticky-actions">
          <button class="btn btn-ghost" data-action="editor-discard"${attr(!dirty, 'disabled')}>Discard changes</button><span class="spacer"></span>
          <button class="btn" data-action="editor-save" data-state="draft">${icon('check')}Save draft</button>
          <button class="btn btn-primary" data-action="editor-save" data-state="ready">${icon('checkCircle')}Save and mark ready</button>
        </div>
      </div>
      <aside class="stack orig-col" style="min-width:0">
        <section class="card card-pad">${flagsPanel(flags, 'ui.editorDraft.content')}</section>
        ${releaseSection(lab)}
        <section class="card card-pad stack tight" aria-labelledby="vh-h"><h2 id="vh-h">Versions</h2>
          ${[...lab.versions].reverse().map((v) => { const uses = assigned.filter((a) => a.versionId === v.id); return html`<div class="row between" style="padding:6px 0;border-bottom:1px dashed var(--line)"><div><strong class="small">Version ${v.number}</strong><div class="xs muted">${v.state === 'ready' ? 'Ready' : 'Draft'} · ${fmtDayTime(v.createdAt)}</div></div>
            ${uses.length ? html`<span class="pill tone-blue">${icon('lock')}Assigned</span>` : v.state === 'ready' ? html`<span class="pill tone-accent">${icon('check')}Ready</span>` : html`<span class="pill tone-idle">${icon('pencil')}Draft</span>`}</div>`; })}

function editorSave(state) {
  const ed = S.ui.editorDraft; const lab = labById(ed.labId);
  if (state === 'ready') { ed.readyErrors = readyErrors(ed.content); if (ed.readyErrors.length) { U.focusAfter = '#ed-errors'; commit(); return; } }
  ed.readyErrors = [];
  const wasLocked = latestVersion(lab).locked;
  const v = saveLabVersion(lab, ed.content, state);
  ed.content = clone(v.content);
  commit();
  toast(`${wasLocked ? `Saved as version ${v.number}` : `Version ${v.number} saved`}${state === 'ready' ? ' and marked Ready to Assign' : ' as a draft'}.`);
}
function newManualLab() {
  const c = blankContent(); c.subject = (myClasses()[0] || {}).subject || '';
  const lab = newLab(c, 'manual');
  S.ui.editorDraft = null; commit(); go(`lab-${lab.id}`);
  toast('New draft created. Fill in the steps, then save.');
}

/* =====================================================================
   Live Progress: one card per group, pacing chart, group detail panel.
   Data source: S.progress + S.help, shaped like the realtime events a
   production backend would push from students' devices.
   ===================================================================== */
const shortGroup = (name) => { const m = /^bench\s*(\d+)/i.exec(name); return m ? `B${m[1]}` : initials(name); };
const naturalCmp = (a, b) => a.localeCompare(b, undefined, { numeric: true });

function liveView() {
  if (!myClasses().length) return html`<div class="card">${emptyState({ ico: 'activity', title: 'No classes yet', text: 'Create a class and assign a lab to see live progress here.', actions: html`<a class="btn btn-primary" href="#class-new">Create class</a>` })}</div>`;
  const ctx = ensureCtx(); const sess = sessionById(ctx.sessionId);
  if (!sess || sess.classId !== ctx.classId || (ctx.periodId && sess.periodId !== ctx.periodId)) {
    return html`<div class="card">${emptyState({ ico: 'calendar', title: 'No lab sessions here yet', text: 'Assign a lab to this class and period. Its session will appear in the selector above.', actions: html`<button class="btn btn-primary" data-action="assign-open" data-cid="${ctx.classId}">${icon('send')}Assign a lab</button>` })}</div>`;
  }
  const c = sessionContent(sess); const now = Date.now();
  const cls = classById(sess.classId); const lab = labById(sess.labId); const v = versionById(lab, sess.versionId);
  const ps = progressFor(sess.id);
  const statuses = new Map(ps.map((p) => [p.id, groupStatus(p, sess, c, now)]));
  const counts = Object.fromEntries(GROUP_STATUS_ORDER.map((k) => [k, 0]));
  statuses.forEach((s) => counts[s.key]++);
  const filter = S.ui.liveFilter || 'all';
  const sortKey = S.ui.liveSort || 'name';
  let list = ps.filter((p) => filter === 'all' || statuses.get(p.id).key === filter);
  list.sort((a, b) => {
    const ga = groupById(a.groupId), gb = groupById(b.groupId);
    if (sortKey === 'progress') return b.completed.length - a.completed.length || naturalCmp(ga.name, gb.name);
    if (sortKey === 'activity') return (a.lastActivityAt || 0) - (b.lastActivityAt || 0) || naturalCmp(ga.name, gb.name);
    return naturalCmp(ga.name, gb.name);
  });
  const elapsed = sessionElapsed(sess, now); const planned = plannedMinutes(c) * MIN;
  const groupsAvailable = groupsIn(sess.classId, sess.periodId).length;
  const openHelp = S.help.filter((h) => h.sessionId === sess.id && h.status !== 'resolved').length;
  return html`<div class="stack loose">
    <section class="card card-pad stack" aria-labelledby="ls-title">
      <div class="session-head">
        <div class="stack tight" style="min-width:0"><div class="row wrap">${sessionPill(sess.status)}<span class="tag">${icon('lock', 'sm')}Version ${v.number}</span></div>
          <h2 id="ls-title" style="font-size:1.4rem">${c.title}</h2><span class="small muted">${cls.name} · ${periodName(cls.id, sess.periodId)} · ${plural(ps.length || groupsAvailable, 'group')}</span>${sess.status !== 'completed' ? joinCodeChip(cls) : ''}</div>
        ${sess.status === 'scheduled' ? html`<div class="stack tight" style="align-items:flex-end"><span class="small muted">Scheduled ${sess.scheduledFor === todayISO() ? 'for today' : 'for ' + fmtDate(new Date(sess.scheduledFor + 'T12:00').getTime())} · ${plannedMinutes(c)} min planned</span>
          ${groupsAvailable ? html`<button class="btn btn-primary" data-action="session-start" data-sid="${sess.id}">${icon('play')}Start session</button>`
            : html`<a class="btn" href="#class-${cls.id}" data-action="class-period-go" data-cid="${cls.id}" data-pid="${sess.periodId}">${icon('layers')}Arrange lab groups first</a>`}</div>`
          : html`<div class="clock-block">
            <div><div class="k">Elapsed</div><div class="v">${tickSession(sess, 'elapsed')}</div></div>
            <div><div class="k">${elapsed <= planned ? 'Planned time left' : 'Past planned time'}</div><div class="v">${tickSession(sess, 'remaining')}</div></div>
            <div><div class="k">Planned</div><div class="v">${plannedMinutes(c)} min</div></div></div>`}
        ${sess.status === 'active' ? html`<div class="row"><button class="btn" data-action="session-pause" data-sid="${sess.id}">${icon('pause')}Pause</button><button class="btn btn-danger" data-action="session-end-ask" data-sid="${sess.id}">${icon('stopCircle')}End session</button></div>`
          : sess.status === 'paused' ? html`<div class="row"><button class="btn btn-primary" data-action="session-resume" data-sid="${sess.id}">${icon('play')}Resume</button><button class="btn btn-danger" data-action="session-end-ask" data-sid="${sess.id}">${icon('stopCircle')}End session</button></div>`
          : sess.status === 'completed' ? html`<span class="small muted">Ended ${fmtDayTime(sess.endedAt)}</span>` : ''}
      </div>
      ${sess.status === 'paused' ? html`<div class="notice warn">${icon('pause')}<div>Paused at ${fmtClock(sess.pausedAt)}. Session and step timers are frozen; help request wait times keep counting.</div></div>` : ''}
      ${sess.status !== 'scheduled' && ps.length ? pacingChart(sess, c, ps, statuses, now) : ''}
    </section>
    ${sess.status === 'scheduled' ? html`<div class="card">${emptyState({ ico: 'play', title: 'This session hasn’t started', text: groupsAvailable ? `When you start it, ${plural(groupsAvailable, 'group')} can begin step 1 and their progress will appear here.` : 'This period has no lab groups yet. Arrange students into groups on the class page, then start the session.', compact: true })}</div>` : html`
    <div class="live-tools">
      <div class="chips" role="group" aria-label="Filter groups by status">
        <button class="chip" aria-pressed="${filter === 'all'}" data-action="live-filter" data-f="all">All<span class="count">${ps.length}</span></button>
        ${GROUP_STATUS_ORDER.map((k) => html`<button class="chip" aria-pressed="${filter === k}" data-action="live-filter" data-f="${k}"${attr(!counts[k] && filter !== k, 'aria-disabled', 'true')}>${icon(GROUP_STATUS[k].icon, 'sm')}${GROUP_STATUS[k].label}<span class="count">${counts[k]}</span></button>`)}
      </div>
      <div class="row wrap">
        <label class="small strong" for="live-sort">Sort</label>
        <select class="select sm" id="live-sort" style="width:auto" data-bind="ui.liveSort" data-type="str">${options([['name', 'Group name'], ['progress', 'Most progress'], ['activity', 'Longest since activity']], sortKey)}</select>
        ${behindExplainer()}
      </div>
    </div>
    ${list.length ? html`<div class="groups-grid">${list.map((p) => groupTile(p, sess, c, statuses.get(p.id), now))}</div>`
      : html`<div class="card">${emptyState({ ico: 'search', title: 'No groups with this status', text: 'Choose another filter to see the rest of the class.', compact: true, actions: html`<button class="btn btn-sm" data-action="live-filter" data-f="all">Show all groups</button>` })}</div>`}`}
    ${sess.status === 'active' || sess.status === 'paused' ? demoPanel(sess, ps) : ''}
    ${openHelp ? html`<p class="small"><a href="#help">${icon('lifebuoy', 'sm')} ${plural(openHelp, 'open help request')} for this session in the Help Queue</a></p>` : ''}
  </div>
  ${U.drawer ? groupDrawer(U.drawer) : ''}`;
}

function behindExplainer() {
  const t = S.settings.behindMinutes;
  return html`<details class="explain"${attr(U.explainOpen, 'open')}><summary data-action="explain-toggle" aria-expanded="${!!U.explainOpen}">${icon('info', 'sm')}How “May Be Behind” works</summary>
    ${U.explainOpen ? html`<div class="explain-pop" role="note">
      <p>A group is flagged when the session clock is more than <strong>${t} minutes</strong> past the planned finish of the step it’s on. Planned finish is setup time plus the step times up to that step.</p>
      <p class="small muted">It’s a prompt to check in, not a grade. A lost connection or a quiet group is never flagged as behind for that reason alone. Paused time doesn’t count.</p>
      <div class="row"><label class="small strong" for="behind-t">Flag after</label>

function pacingChart(sess, c, ps, statuses, now) {
  const n = c.steps.length; const plannedIdx = plannedStepAt(c, sessionElapsed(sess, now));

  const desc = cols.map((list, i) => `${i < n ? 'Step ' + (i + 1) : 'Finished'}: ${list.length ? list.map((p) => groupById(p.groupId).name).join(', ') : 'none'}`).join('; ');
  return html`<div class="pacing" role="img" aria-label="Pacing: where each group is. The plan expects groups on ${plannedIdx < n ? 'step ' + (plannedIdx + 1) : 'cleanup or done'} now. ${desc}.">
    <div class="row between wrap" style="margin-bottom:6px"><span class="eyebrow">Pacing</span><span class="xs muted">${plannedIdx < n ? html`Plan says step <strong>${plannedIdx + 1}</strong> by now (shaded)` : 'Plan says all steps should be done'}</span></div>

}

/* Autoplay: random events across online groups in active sessions. */
function autoplayTick() {
  const sessions = mySessions().filter((s) => s.status === 'active');
  if (!sessions.length) return;
  const sess = sessions[Math.floor(Math.random() * sessions.length)];
  const ps = progressFor(sess.id).filter((p) => !p.finishedAt);
  if (!ps.length) return;
  const p = ps[Math.floor(Math.random() * ps.length)]; const g = groupById(p.groupId);
  const r = Math.random();
  if (p.connection === 'lost') { if (r < 0.5) { Sim.toggleConnection(p); toast(`${g.name} reconnected.`, 'wifi'); } return; }
  if (r < 0.55) { const res = Sim.advance(p, sess); if (res === 'requested') toast(`${g.name} is waiting for your checkpoint approval.`, 'clipboard'); }
  else if (r < 0.75) Sim.record(p, sess);
  else if (r < 0.88 && !openHelpForGroup(sess.id, p.groupId).length) { const cats = Object.keys(SAMPLE_HELP); const cat = cats[Math.floor(Math.random() * cats.length)]; Sim.help(p, sess, cat, SAMPLE_HELP[cat][Math.floor(Math.random() * SAMPLE_HELP[cat].length)]); toast(`${g.name} asked for help (${cat}).`, 'lifebuoy'); }
  else if (r < 0.92) { Sim.toggleConnection(p); }
}

  return wide ? html`<div class="panel row between wrap"><span>${icon('clipboard')} <strong>${cp.title}</strong> · ${label}</span>${btn}</div>`

/* =====================================================================

  const open = pool.filter((h) => h.status !== 'resolved').sort((a, b) => a.createdAt - b.createdAt);
  const resolved = pool.filter((h) => h.status === 'resolved').sort((a, b) => b.resolvedAt - a.resolvedAt);
  const tab = S.ui.helpTab || 'open';

  return html`<div class="stack loose">
    <div class="row between wrap">
      <div class="chips" role="group" aria-label="Which requests to show">
        <button class="chip" aria-pressed="${scope === 'session'}" data-action="help-scope" data-scope="session"${attr(!sess, 'disabled')}>${icon('activity', 'sm')}Selected session${sess ? html`<span class="count">${shortPeriod(periodName(sess.classId, sess.periodId))}</span>` : ''}</button>
        <button class="chip" aria-pressed="${scope === 'all' || !sess}" data-action="help-scope" data-scope="all">${icon('users', 'sm')}All my classes<span class="count">${allOpen} open</span></button>

      <button class="tab" role="tab" aria-selected="${tab === 'open'}" data-action="help-tab" data-tab="open">${icon('hand', 'sm')}Unresolved <span class="badge ${open.length ? '' : 'zero'}">${open.length}</span></button>
      <button class="tab" role="tab" aria-selected="${tab === 'resolved'}" data-action="help-tab" data-tab="resolved">${icon('checkCircle', 'sm')}Resolved history <span class="badge zero">${resolved.length}</span></button>
    </div>
    ${tab === 'open'
      ? (open.length ? html`<ol class="hq" style="list-style:none;margin:0;padding:0" aria-label="Unresolved requests in arrival order">${open.map((h, i) => helpItem(h, i + 1))}</ol>`
        : html`<div class="card">${emptyState({ ico: 'lifebuoy', title: 'No one is waiting', text: scope === 'all' ? 'When students ask for help in any of your classes, their requests line up here in the order they arrive.' : 'Requests from this session will line up here in the order they arrive.', compact: true })}</div>`)
      : (resolved.length ? html`<ol class="hq" style="list-style:none;margin:0;padding:0" aria-label="Resolved requests, most recent first">${resolved.map((h) => helpItem(h, null))}</ol>`

    ${scope === 'session' && live ? demoPanel(sess, progressFor(sess.id)) : ''}

    </div>` : ''}

const normCode = (s) => { const t = String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); return t.length === 6 ? `${t.slice(0, 3)}-${t.slice(3)}` : t; };
/** Look up a class code. In production this is a rate-limited server endpoint that reveals only the preview fields. */
function findClassByCode(code) {
  const c = normCode(code);
  if (!c) return { status: 'empty' };
  const cls = S.classes.find((x) => x.joinCode === c);
  if (cls) return cls.joinEnabled === false ? { status: 'disabled', cls } : { status: 'ok', cls };
  if (S.classes.some((x) => (x.previousCodes || []).some((p) => p.code === c))) return { status: 'expired' };
  return { status: 'invalid' };
}

async function readAvatar(file) {
  if (!file || !/^image\//.test(file.type)) throw new Error('Choose an image file (PNG, JPEG, WebP or GIF).');
  if (file.size > 8 * 1024 * 1024) throw new Error('That image is larger than 8 MB. Choose a smaller one.');
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('That image couldn’t be read.')); i.src = url; });
    const side = Math.min(img.naturalWidth, img.naturalHeight); const cv = document.createElement('canvas'); cv.width = cv.height = 160;
    cv.getContext('2d').drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, 160, 160);
    return cv.toDataURL('image/jpeg', 0.85);
  } finally { URL.revokeObjectURL(url); }
}

function confirmJoin() {

let lastModal = null, lastDrawer = null, modalReturn = null;
function render() {
  const root = document.getElementById('app');
  const r = guardRoute(parseRoute());
  if (r.redirect && location.hash !== '#' + r.name) history.replaceState(null, '', '#' + r.name);
  U.route = r;
  const user = me();
  let page;
  if (!user) { page = html`${demoBand()}${authView(r)}`; document.title = 'Labby'; }
  else if (r.name === 's/onboarding') { page = onboardingView(); document.title = 'Set up your profile · Labby'; }
  else if (r.name === 'join') { page = workspacesFor(user).includes('student') ? wsShell('student', r, 'Join a class', joinView(r)) : joinStandalone(r); document.title = 'Join a class · Labby'; }
  else {
    const ws = workspaceOfRoute(r.name); user.lastWorkspace = ws;
    const [title, body, ctx] = ws === 'teacher' ? teacherPage(r) : ws === 'student' ? studentPage(r) : researchPage(r);
    page = ws === 'teacher' ? teacherShell(r, title, body, ctx || '') : wsShell(ws, r, title, body, ctx || '');
    document.title = `${title} · Labby`;
  }
  morphInto(root, html`${page}${modalView()}${toastsView()}`.s);
  afterRender(r);
}
function afterRender(r) {
  // Live session lifecycle: leaving the session route stops the camera, the AI connection and pending analysis.
  const liveKey = r.name === 's/live' && r.id ? `class:${r.id}` : r.name === 'r/run' && r.sub === 'guided' ? `run:${r.id}` : null;
  if (Live.key && Live.key !== liveKey) Live.teardown();
  Live.attachVideo();
  const key = r.name + (r.id || '');
  if (key !== U.lastRouteKey) {
    U.lastRouteKey = key;
    window.scrollTo(0, 0);
    const t = document.getElementById('page-title');
    if (t && document.activeElement === document.body) t.focus({ preventScroll: true });
    else if (t && !document.activeElement.closest('.modal')) t.focus({ preventScroll: true });
  }
  const modalOpen = U.modal ? U.modal.type : null;
  if (modalOpen && modalOpen !== lastModal) { modalReturn = modalReturn || document.activeElement; const m = document.querySelector('.modal'); const f = m && m.querySelector('input:not([type=hidden]):not([disabled]), select, textarea, button:not([data-action=modal-close])'); (f || m).focus(); }
  if (!modalOpen && lastModal && modalReturn) { if (document.contains(modalReturn)) modalReturn.focus(); modalReturn = null; }
  lastModal = modalOpen;
  if (U.drawer && U.drawer !== lastDrawer) { const b = document.querySelector('.drawer [data-action=drawer-close]'); if (b) b.focus(); }
  if (!U.drawer && lastDrawer) { const tile = document.querySelector(`[data-key="gt-${lastDrawer}"] .gt-name`); if (tile) tile.focus(); }
  lastDrawer = U.drawer;
  const chatLen = S.designer.chat.length;
  if (r.name === 'designer' && chatLen !== U.chatLen) { const sc = document.querySelector('.designer-left .chat'); if (sc && sc.parentElement) sc.parentElement.scrollTop = sc.parentElement.scrollHeight; }
  U.chatLen = chatLen;
  if (U.focusAfter) { const el = document.querySelector(U.focusAfter); U.focusAfter = null; if (el) { if (!el.matches('input,select,textarea,button,a')) el.setAttribute('tabindex', '-1'); el.focus(); el.scrollIntoView({ block: 'center' }); } }
}

const BIND_HOOKS = {
  'U.modal.classId': () => { U.modal.periodIds = []; U.modal.error = ''; },

  'U.modal.ok': () => { U.modal.error = ''; },

function applyBind(el) {
  const path = el.dataset.bind; const type = el.dataset.type || 'str';
  if (el.type === 'radio' && !el.checked) return;
  let v;
  switch (type) {
    case 'bool': v = el.checked; break;
    case 'int': v = el.value === '' ? '' : parseInt(el.value, 10); if (Number.isNaN(v)) v = ''; break;
    case 'num': v = el.value === '' ? '' : parseFloat(el.value); if (Number.isNaN(v)) v = ''; break;
    case 'numOrNull': v = el.value === '' ? null : Number(el.value); if (Number.isNaN(v)) v = null; break;
    case 'csv': v = el.value.split(',').map((s) => s.trim()).filter(Boolean); break;
    default: v = el.value;
  }
  if (path.startsWith('U.')) setPath(U, path.slice(2), v); else setPath(S, path, v);
  if (BIND_HOOKS[path]) BIND_HOOKS[path]();
  if (path.startsWith('designer.form') || path.startsWith('designer.logistics')) S.designer.errors = [];
  commit();
}

  'help-resolve': (el) => { const h = byId(S.help, el.dataset.hid); helpSetStatus(h, 'resolved'); commit(); toast(`Resolved ${groupById(h.groupId).name}’s request. It moved to Resolved history.`, 'check'); },
  'help-reopen': (el) => { const h = byId(S.help, el.dataset.hid); const dup = S.help.find((x) => x.id !== h.id && x.sessionId === h.sessionId && x.groupId === h.groupId && x.category === h.category && x.status !== 'resolved'); if (dup) { toast(`${groupById(h.groupId).name} already has an open ${h.category.toLowerCase()} request. Update that one instead.`, 'alert'); return; } helpSetStatus(h, 'waiting'); S.ui.helpTab = 'open'; commit(); toast('Reopened at its original place in the queue.', 'reopen'); },
  'help-open-group': (el) => { const h = byId(S.help, el.dataset.hid); const p = S.progress.find((x) => x.sessionId === h.sessionId && x.groupId === h.groupId); openSession(h.sessionId, 'live'); if (p) { U.drawer = p.id; commit(); } },
};
const CHANGES = {
  'demo-role': (el) => {
    const v = el.value;
    if (v === 'out') { S.currentUserId = null; commit(); go('signup'); return; }
    if (v === 'own') return;
    const u = S.users.find((x) => x.id === v); if (!u) return; S.currentUserId = u.id; commit(); go(homeFor());
  },
  'ctx-class': (el) => { setCtxClass(el.value); U.drawer = null; commit(); },
  'ctx-period': (el) => { setCtxPeriod(el.value); U.drawer = null; commit(); },
  'ctx-session': (el) => { if (el.value) { setCtxSession(el.value); U.drawer = null; commit(); } },
  'student-group': (el) => {
    const { sid, cid, pid } = el.dataset;
    groupsIn(cid, pid).forEach((g) => { g.memberIds = g.memberIds.filter((m) => m !== sid); });
    const g = groupById(el.value); if (g) g.memberIds.push(sid);
    commit();
  },
  'mat-basis': (el) => { const m = getPath(S, el.dataset.path); const v = el.value; if (v === 'student') { m.per = 'student'; m.sharedBy = 1; } else { m.per = 'group'; m.sharedBy = v.startsWith('share') ? +v.slice(5) : 1; } commit(); },
  'cp-toggle': (el) => { const c = getPath(S, el.dataset.path); normalizeContent(c); const ex = checkpointAfter(c, el.dataset.sid); if (ex) c.checkpoints = c.checkpoints.filter((x) => x !== ex); else { const st = c.steps.find((x) => x.id === el.dataset.sid); c.checkpoints.push({ ...blankCheckpoint(el.dataset.sid), title: `Teacher check: ${st ? st.title : 'step'}`, kind: 'info', responseRequired: false, approvalRequired: true, questions: [] }); } commit(); },
  'import-file': (el) => { const f = el.files && el.files[0]; el.value = ''; importFile(f); },
  'demo-cat': (el) => { S.ui.demoCat = el.value; S.ui.demoMsg = SAMPLE_HELP[el.value][0]; commit(); },
};
const SUBMITS_BASE = {
  signin: () => submitSignin(),
  signup: () => submitSignup(),
  'create-class': () => submitCreateClass(),
  'designer-ask': () => designerAsk(S.designer.draftMsg),
  'demo-help': () => {
    const sess = sessionById(S.ui.ctx.sessionId); const ps = progressFor(sess.id);
    const p = ps.find((x) => x.id === S.ui.demoGroupId) || ps[0];
    const cat = S.ui.demoCat || 'Equipment'; const msg = (S.ui.demoMsg ?? SAMPLE_HELP[cat][0]).trim();
    if (!msg) { toast('Type a message for the help request.', 'alert'); return; }
    const res = Sim.help(p, sess, cat, msg);
    S.ui.demoMsg = SAMPLE_HELP[cat][(SAMPLE_HELP[cat].indexOf(msg) + 1) % SAMPLE_HELP[cat].length];
    commit();
    toast(res.updated ? `${groupById(p.groupId).name} already had an open ${cat.toLowerCase()} request, so it was updated instead of duplicated.` : `${groupById(p.groupId).name} sent a ${cat.toLowerCase()} help request.`, 'lifebuoy');
  },
};

const SUBMITS = SUBMITS_BASE;
Object.assign(ACTIONS, STUDENT_ACTIONS, LIVE_ACTIONS, TEACHER2_ACTIONS, typeof RESEARCH_ACTIONS === 'object' ? RESEARCH_ACTIONS : {});
Object.assign(CHANGES, STUDENT_CHANGES, LIVE_CHANGES, TEACHER2_CHANGES, typeof RESEARCH_CHANGES === 'object' ? RESEARCH_CHANGES : {});
Object.assign(SUBMITS, STUDENT_SUBMITS, LIVE_SUBMITS, typeof RESEARCH_SUBMITS === 'object' ? RESEARCH_SUBMITS : {});

/* ---------- Event wiring ---------- */
function wireEvents() {
  document.addEventListener('click', (ev) => {
    if (U.menu && !ev.target.closest('.profile')) { U.menu = false; commit(); }
    if (U.newMenu && !ev.target.closest('.new-wrap')) { U.newMenu = false; commit(); }
    if (U.explainOpen && !ev.target.closest('.explain')) { U.explainOpen = false; commit(); }
    const el = ev.target.closest('[data-action]');
    const control = ev.target.closest('input, select, textarea, label');
    if (el && control && control !== el && el.contains(control)) return; // let form controls inside clickable areas work normally
    if (!el || el.disabled || el.getAttribute('aria-disabled') === 'true' && el.tagName === 'BUTTON' && el.dataset.action !== 'live-filter') return;
    const fn = ACTIONS[el.dataset.action];
    if (!fn) return;
    if (el.tagName !== 'A' && el.tagName !== 'INPUT') ev.preventDefault();
    fn(el, ev);
  });
  document.addEventListener('input', (ev) => {
    const el = ev.target;
    if (el.dataset && el.dataset.bind && el.type !== 'checkbox' && el.type !== 'radio' && el.tagName !== 'SELECT') applyBind(el);
  });
  document.addEventListener('change', (ev) => {
    const el = ev.target; if (!el.dataset) return;
    if (el.dataset.bind && (el.type === 'checkbox' || el.type === 'radio' || el.tagName === 'SELECT')) applyBind(el);
    if (el.dataset.change && CHANGES[el.dataset.change]) CHANGES[el.dataset.change](el, ev);
  });
  document.addEventListener('submit', (ev) => {
    const f = ev.target.closest('form[data-submit]'); if (!f) return;
    ev.preventDefault(); const fn = SUBMITS[f.dataset.submit]; if (fn) fn(f);
  });
  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape') {
      if (U.modal) { U.modal = null; commit(); return; }
      if (U.drawer) { U.drawer = null; commit(); return; }
      if (U.menu) { U.menu = false; commit(); const b = document.querySelector('.profile-btn'); if (b) b.focus(); return; }
      if (U.explainOpen) { U.explainOpen = false; commit(); return; }
      if (U.navOpen) { U.navOpen = false; commit(); return; }
    }
    if (ev.key === 'Enter' && (ev.metaKey || ev.ctrlKey) && ev.target.id === 'dz-msg') { ev.preventDefault(); designerAsk(S.designer.draftMsg); }
    if (ev.key === 'Tab') {
      const box = document.querySelector('.modal') || document.querySelector('.drawer') || (U.navOpen && document.querySelector('.sidebar.open'));
      if (!box) return;
      const f = Array.from(box.querySelectorAll('a[href], button:not([disabled]), input:not([disabled]):not(.sr-only), select:not([disabled]), textarea:not([disabled]), [tabindex="0"]')).filter((x) => x.offsetParent !== null);
      if (!f.length) return;
      const first = f[0], last = f[f.length - 1];
      if (!box.contains(document.activeElement)) { ev.preventDefault(); first.focus(); }
      else if (ev.shiftKey && document.activeElement === first) { ev.preventDefault(); last.focus(); }
      else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
    }
  });
  document.addEventListener('dragover', (ev) => { if (U.route && U.route.name === 'import') { ev.preventDefault(); const over = !!ev.target.closest('#dropzone'); if (over !== U.dropOver) { U.dropOver = over; commit(); } } });
  document.addEventListener('dragleave', (ev) => { if (U.dropOver && !ev.relatedTarget) { U.dropOver = false; commit(); } });
  document.addEventListener('drop', (ev) => {
    if (!U.route || U.route.name !== 'import') return;
    ev.preventDefault(); U.dropOver = false;
    const f = ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files[0];
    if (f) importFile(f); else commit();
  });
  window.addEventListener('hashchange', () => { U.menu = false; U.navOpen = false; U.drawer = null; U.explainOpen = false; U.modal = U.modal && U.modal.type === 'assign' ? U.modal : null; commit(); });
}

/* ---------- Clocks ---------- */
let tickCount = 0;
function tick() {
  tickCount++;
  const now = Date.now();
  document.querySelectorAll('[data-tick]').forEach((el) => {
    let txt = el.textContent;
    const kind = el.dataset.tick;
    if (kind === 'since') { const t = +el.dataset.t; txt = el.dataset.fmt === 'ago' ? fmtAgo(t, now) : el.dataset.fmt === 'mins' ? fmtMins(now - t) : fmtTimer(now - t); }
    else if (kind === 'session') { const s = sessionById(el.dataset.sid); if (s) { const e = sessionElapsed(s, now); txt = el.dataset.what === 'elapsed' ? fmtTimer(e) : fmtTimer(plannedMinutes(sessionContent(s)) * MIN - e); } }
    else if (kind === 'step') { const p = S.progress.find((x) => x.id === el.dataset.pid); const s = p && sessionById(p.sessionId); if (p && s) txt = p.stepStartedAt && !p.finishedAt ? fmtTimer(stepTimeMs(p, s, now)) : '—'; }
    if (el.textContent !== txt) el.textContent = txt;
  });
  const user = me();
  if (user && user.role === 'teacher') {
    if (S.demo.autoplay && tickCount % 6 === 0) { autoplayTick(); commit(); }
    else if (tickCount % 15 === 0 && U.route && ['overview', 'live', 'help'].includes(U.route.name)) commit();
  }
  if (user && user.role !== 'teacher' || (U.route && /^(s|r)\//.test(U.route.name))) {
    if (tickCount % 10 === 0 && U.route && ['s/overview', 's/live', 's/lab', 's/labs', 'r/overview'].includes(U.route.name)) commit();
  }
}

/* ---------- Boot ---------- */
function boot() {
  loadState();
  initLiveAI();
  wireEvents();
  if (!location.hash) history.replaceState(null, '', '#' + (me() ? homeFor(me().role) : 'signin'));
  render();
  setInterval(tick, 1000);
}
boot();

</script>
